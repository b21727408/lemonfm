# architecture/modules.yaml
#
# The single definition of every boundary in this system, expressed so a
# generator can read it rather than so a human can admire it.
#
# Generates:  backend policy inputs and module shells · lemon_lints package
#             rules · the pubspec dependency graph · deterministic policy data
#
# This file validates against architecture/modules.schema.json before anything
# is generated from it. An unknown field is a build failure — a typo in a
# boundary definition must not silently disable a boundary.

version: 1

# ---------------------------------------------------------------------------
# Policies. Declarative, because a generator cannot read English.
# Anything expressed as prose here would have to be re-implemented inside the
# generator, and then there would be two sources of truth.
# ---------------------------------------------------------------------------
policies:

  graph:
    synchronous_call_cycles: forbidden
    undeclared_dependencies: forbidden

  cross_module:
    # Two different capabilities, deliberately separated. Being allowed to
    # consume a module's events is not permission to call it at runtime.
    calls: declared_only          # only what a module lists under `calls`
    subscriptions: declared_only  # only what it lists under `subscribes`
    visibility: api_only          # and only <module>.api, never internals
    api_signatures:
      may_expose: [api_types, jdk_types, foundation_types]
      may_not_expose: [domain, application, infrastructure, jooq_generated]
      own_api_category: api_types
      namespace_categories:
        jdk_types: [java.]
        foundation_types: [fm.lemon.foundation.]
        jooq_generated: [fm.lemon.generated.jooq.]
      annotation_only_types:
        - fm.lemon.architecture.ExternalIo
        - org.jspecify.annotations.NonNull
        - org.jspecify.annotations.Nullable
        - org.jspecify.annotations.NullMarked
        - org.jspecify.annotations.NullUnmarked
        - org.springframework.modulith.NamedInterface

  persistence:
    ownership: schema_per_module
    cross_schema_access: forbidden

  domain_layer:
    may_depend_on_other_modules: false
    forbidden_namespaces:
      java:
        - org.springframework
        - org.jooq
        - com.fasterxml.jackson
        - jakarta.persistence
        - jakarta.servlet
      dart:
        - package:flutter
        - package:flutter_riverpod
        - package:riverpod
        - package:dio
    forbidden_calls:
      dart: ["DateTime.now", "Random", "Platform"]
      java: ["System.currentTimeMillis", "java.util.Date", "Math.random"]

  layers:
    # api is not part of the chain. It is a self-standing contract surface, so
    # a caller compiling against it is not compiled against anything behind it.
    order: [infrastructure, application, domain]   # each may depend rightward only
    domain_depends_on: []
    api_may_depend_on: [api_types, jdk_types, foundation_types]
    api_may_not_depend_on: [domain, application, infrastructure, jooq_generated]
    api_implemented_by: application

  flutter_layers:
    # Workspace-package permission and layer permission are both required. A
    # feature declaring api_client does not make it legal from presentation.
    domain:
      may_import_own_layers: [domain]
      may_import_workspace_packages: [foundation]
      may_import_external_packages: []
    application:
      may_import_own_layers: [domain, application]
      may_import_workspace_packages: [foundation]
      may_import_external_packages: []
    data:
      may_import_own_layers: [domain, application, data]
      may_import_workspace_packages: [foundation, api_client, telemetry, realtime_client, secure_store]
      may_import_external_packages: []
    presentation:
      may_import_own_layers: [domain, application, presentation]
      may_import_workspace_packages: [foundation, lemon_ui, telemetry]
      may_import_external_packages: [flutter, flutter_riverpod, riverpod]
    appearance:
      owner: lemon_ui
      forbidden_feature_imports:
        - package:flutter/material.dart
        - package:flutter/cupertino.dart

  transactions:
    owner: outermost_application_operation
    synchronous_module_calls: join_caller_transaction
    external_io_inside_transaction: forbidden      # no vendor HTTP, no SMS, no push
    external_io_marker: fm.lemon.architecture.ExternalIo
    external_io_scope: capability
    requires_new:
      application_code: forbidden
      framework_exceptions: [spring_modulith_application_module_listener]

  events:
    delivery: in_process_durable
    guarantee: at_least_once      # never exactly-once; handlers must be idempotent
    handler_idempotency: required
    payloads_may_expose: [api_types, jdk_types]
    required_fields: [eventId, aggregateId, aggregateVersion, occurredAt]
    ordering: monotonic_per_aggregate   # a projection never applies N after N+1
    no_orphan: true               # an event without a current consumer is not published
    retry:
      max_attempts: 8
      backoff: exponential
      poison_alert: true
      completed_retention: 7d

# How each policy is actually enforced. Named here so a claim in a document can
# be checked against a mechanism that exists.
enforcement:
  graph.synchronous_call_cycles: [generated_call_graph_check]
  graph.undeclared_dependencies: [spring_modulith_typed_dependencies, pubspec_graph_check, lemon_lints]
  cross_module.calls: [spring_modulith_typed_dependencies, lemon_lints, pubspec_graph_check]
  cross_module.subscriptions: [spring_modulith_typed_dependencies]
  cross_module.api_signatures: [archunit]
  persistence.cross_schema_access: [archunit, repository_sql_boundary]
  domain_layer.forbidden_namespaces: [archunit, lemon_lints]
  domain_layer.forbidden_calls: [lemon_lints, forbidden_apis]
  layers.order: [archunit]
  flutter_layers.imports: [lemon_lints]
  flutter_layers.appearance: [lemon_lints]
  transactions.external_io_inside_transaction: [archunit_external_io_marker]
  transactions.requires_new.application_code: [archunit]
  events.no_orphan: [generator_check]
  events.handler_idempotency: [review, integration_test]

# ---------------------------------------------------------------------------
# Backend — Spring Modulith application modules under fm.lemon
# Each has: api / application / domain / infrastructure
# ---------------------------------------------------------------------------
backend:

  identity:
    schema: identity
    owns: [accounts, phone identity hashes, sessions, ban anchors, age gate]
    calls: []
    publishes: [AccountDeleted, AccountBanned]
    notes: >
      Root of the graph, deliberately. The ban anchor outlives every other
      record (docs/01 §Account deletion). Session protocol is in docs/04 §Auth.

  profile:
    schema: profile
    owns: [nicknames, representations, prompt answers, interest selections, bios]
    calls: [identity.api, content.api, media.api, safety.api]
    subscribes:
      identity: [AccountDeleted]
    publishes: [ProfileUpdated, RepresentationChanged, ProfilePurged]
    notes: >
      Calls content because an interest id arriving from a client is untrusted
      input: "the client got the list from us" is not validation. Calls media
      to verify a representation is owned, ready and past moderation. Calls
      safety because a nickname, bio or prompt answer is classified at save
      time — a profile is a broadcast surface, and a slur in a bio reaches more
      people than one in a message (docs/06 §Layer 2).

  quiz:
    schema: quiz
    owns: [results, collections, trait signals]
    calls: [identity.api, content.api]
    subscribes:
      identity: [AccountDeleted]
    publishes: [ResultEarned, ResultRemoved, TraitSignalChanged]

  discovery:
    schema: discovery
    owns: [candidate projection, ranking, impressions, exposure fatigue]
    calls: [safety.api]
    subscribes:
      profile:   [ProfileUpdated, RepresentationChanged, ProfilePurged]
      quiz:      [ResultEarned, ResultRemoved, TraitSignalChanged]
      safety:    [ContactEligibilityChanged]
      commerce:  [BoostStarted, BoostEnded]
      messaging: [InboundRequestStateChanged]
      identity:  [AccountDeleted, AccountBanned]
    notes: >
      Calls exactly one module, and only at request time: a bulk eligibility
      filter. Everything else arrives as events into its projection.

      This split is the point. Being allowed to consume profile's events is not
      permission to call ProfileApi per card — that would be an N+1 across a
      module boundary on the product's main surface.

      Hard exclusions are never eventual. A block, a ban or a cooldown arriving
      three seconds late would put an excluded profile back in the feed, which
      would put eventual consistency inside a product invariant. So the
      projection carries ranking material — proximity, freshness, fatigue,
      boost state, capacity pressure — and `safety.api.filterDiscoverable(viewer,
      candidateIds)` is called once, synchronously, with the whole candidate
      batch before ranking. One call, authoritative, not fifty.

      Two different policies, deliberately separate API methods:
      `filterDiscoverable(viewer, ids)` applies only HARD VISIBILITY exclusions —
      block, ban, account state, hard cooldown. `contactPolicy(sender,
      receiver)` answers the composer-time question — door mode, effort floor,
      inbound capacity, contact restrictions.

      Being visible and being writable-to are not the same thing. A receiver who
      requires a profile must still appear in Discover; that setting decides the
      identity state of a request, not whether they exist. Collapsing the two
      would let a future change quietly remove people from the feed for having
      adjusted a preference.

      The visibility call is authoritative to the bottom: safety asks identity
      for the active set in the same batch, so a deleted, banned or deactivated
      account is excluded even if the projection has not caught up.
      Otherwise a person deleted half a second ago is still a candidate, and the
      one guarantee that must never be eventual would be exactly as eventual as
      the projection.

  messaging:
    schema: messaging
    owns: [requests, conversations, conversation handles, messages, anchor snapshots]
    calls: [identity.api, safety.api, commerce.api, profile.api, quiz.api]
    subscribes:
      identity: [AccountDeleted]
    publishes: [InboundRequestStateChanged, MessageSent]
    notes: >
      Calls commerce for the plan allowance. Safety must not see who paid, so
      safety supplies safety restrictions, commerce supplies the plan
      allowance, and messaging composes the effective ceiling by taking the
      minimum (docs/06 §Quotas). Neither supplying module alone can compute it,
      and that is deliberate.

      Calls profile and quiz to resolve an anchor. A client sends a reference;
      messaging verifies it exists and belongs to the receiver, then stores a
      SNAPSHOT — if the receiver edits that prompt tomorrow, a request from
      three months ago must still say what it was written from.

      On AccountDeleted it severs identity linkage rather than deleting
      delivered messages (docs/01 §Account deletion).

  safety:
    schema: safety
    owns:
      - doors
      - trust states
      - reports
      - enforcement actions
      - blocks
      - cooldowns
      - safety caps
      - inbound admission capacity
      - moderation queue
    calls: [identity.api]
    subscribes:
      identity:  [AccountDeleted, AccountBanned]
      messaging: [InboundRequestStateChanged, MessageSent]
    publishes: [ContactEligibilityChanged, EnforcementApplied]
    notes: >
      Exposes two distinct questions rather than one blurred one:
      `filterDiscoverable` (hard visibility: block, ban, account state, hard
      cooldown) and `contactPolicy` (door mode, effort floor, capacity, contact
      restrictions). Projections may be stale; neither of these may be.

      Owns admission capacity authoritatively. "Can this person accept another
      request right now?" is a contact-authorisation question, not a ranking
      question — so it is answered here, synchronously, at request creation.
      Discovery consumes capacity *pressure* as a ranking input and lowers
      exposure; it never decides admission.

      Does not depend on commerce and never learns who paid, which is what
      makes "money never relaxes a safety restriction" structural rather than
      remembered.

  commerce:
    schema: commerce
    owns: [subscriptions, boosts, entitlements, plan caps]
    calls: [identity.api]
    subscribes:
      identity: [AccountDeleted]
    publishes: [BoostStarted, BoostEnded]

  content:
    schema: content
    owns: [versioned quiz documents, interest lists, taxonomy, prompt question bank]
    calls: []
    publishes: []
    notes: >
      Ranking weights are NOT content. Content carries text and the weights a
      quiz answer contributes to a trait; discovery's ranking weights are
      behaviour and live in remote configuration owned by discovery.

  media:
    schema: media
    owns: [uploads, object keys, variants, moderation state]
    calls: [identity.api]
    subscribes:
      identity: [AccountDeleted]
    publishes: []
    notes: On AccountDeleted, stored objects are deleted, not merely unlinked.

  notification:
    schema: notification
    owns: [device tokens, delivery attempts, preferences]
    calls: [identity.api]
    subscribes:
      messaging: [InboundRequestStateChanged, MessageSent]
      safety:    [EnforcementApplied]
      identity:  [AccountDeleted]
    notes: Subscribes and is never called. Nothing waits on a push being sent.

# Several events an earlier draft published were removed here rather than left
# in place: AccountCreated, ConversationStarted, ConversationEnded,
# TrustStateChanged, MediaModerated. Nothing consumed them. An event kept
# because it might be useful later is an API surface with no caller, maintained
# forever, and it is exactly the kind of speculative abstraction this document
# set exists to prevent. They come back when something needs them.
#
# Every published event above has at least one subscriber, and every
# subscription names a publisher that emits it. The generator checks both
# directions and fails on either kind of orphan: an event nobody consumes is
# an API surface maintained for an imagined future, and a subscription to an
# event nobody emits is a handler that will never run.

# ---------------------------------------------------------------------------
# Flutter — every feature is a real package
# ---------------------------------------------------------------------------
flutter:

  packages:
    foundation:        { dependencies: [] }
    lemon_lints:       { dependencies: [] }
    lemon_ui:          { dependencies: [foundation] }
    api_client:        { dependencies: [foundation], generated_from: contracts/http/public-v1.yaml }
    admin_api_client:  { dependencies: [foundation], generated_from: contracts/http/admin-v1.yaml }
    telemetry:         { dependencies: [foundation], notes: "typed analytics; the vendor SDK exists only here" }
    realtime_client:   { dependencies: [foundation], notes: "socket envelope, dedupe, reconnect, HTTP reconciliation" }
    secure_store:      { dependencies: [foundation], notes: "platform keystore; the only package that knows what a keychain is" }

  features:
    identity:  { dependencies: [foundation, api_client, lemon_ui, telemetry, secure_store] }
    profile:   { dependencies: [foundation, api_client, lemon_ui, telemetry] }
    quiz:      { dependencies: [foundation, api_client, lemon_ui, telemetry] }
    discovery: { dependencies: [foundation, api_client, lemon_ui, telemetry] }
    messaging: { dependencies: [foundation, api_client, lemon_ui, telemetry, realtime_client] }
    safety:    { dependencies: [foundation, api_client, lemon_ui, telemetry] }
    commerce:  { dependencies: [foundation, api_client, lemon_ui, telemetry] }

  apps:
    mobile:     { dependencies: [all_features, lemon_ui, foundation, telemetry, realtime_client, secure_store] }
    widgetbook: { dependencies: [lemon_ui] }
    moderation: { dependencies: [admin_api_client, lemon_ui, foundation] }

  notes: >
    The real boundary is the pubspec dependency graph, not the src/ directory.
    Dart does not prevent importing package:foo/src/x.dart — a lint discourages
    it. What actually stops messaging from using profile is that profile is not
    in messaging's pubspec, and a CI check that this graph matches this file.
    An AI adding the dependency to get its import to work fails that check.

    No feature depends on another. They still reach each other — discovery
    opens a profile, a profile opens the composer — and apps/mobile owns that:
    a feature exposes routes and emits navigation intents, the shell wires
    them. That is why the shell is the only thing depending on everything.

    Each feature is layered internally: domain (pure Dart) → application →
    data → presentation.

# ---------------------------------------------------------------------------
# Deliberately absent. Each may enter later through a written decision with a
# measured reason — never by reflex.
# ---------------------------------------------------------------------------
absent:
  - external message broker (Kafka, RabbitMQ)
  - Redis
  - Kubernetes, service mesh, microservices
  - GraphQL
  - an ORM with lifecycle magic
