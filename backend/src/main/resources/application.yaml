spring:
  application:
    name: lemon-backend
  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema: platform
        schema-initialization:
          enabled: false
  datasource:
    url: ${LEMON_DATABASE_URL:jdbc:postgresql://localhost:5432/lemon}
    username: ${LEMON_DATABASE_USER:lemon}
    password: ${LEMON_DATABASE_PASSWORD:lemon}
  flyway:
    enabled: false
    create-schemas: true
    default-schema: platform
    schemas: platform
    locations: classpath:db/migration
