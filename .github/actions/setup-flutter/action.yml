name: Set up pinned Flutter
description: Restore or download the repository's verified Flutter SDK.

inputs:
  version:
    description: Exact stable Flutter version.
    required: true
  linux-sha256:
    description: SHA-256 from Flutter's official Linux release manifest.
    required: true
  macos-sha256:
    description: SHA-256 from Flutter's official macOS release manifest.
    required: true

runs:
  using: composite
  steps:
    - name: Cache Flutter SDK
      id: cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.tool_cache }}/lemon-flutter-${{ inputs.version }}
        key: lemon-flutter-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    - name: Download and verify Flutter SDK
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        FLUTTER_VERSION: ${{ inputs.version }}
        LINUX_SHA256: ${{ inputs.linux-sha256 }}
        MACOS_SHA256: ${{ inputs.macos-sha256 }}
      run: |
        set -euo pipefail
        destination="$RUNNER_TOOL_CACHE/lemon-flutter-$FLUTTER_VERSION"
        mkdir -p "$destination"
        if [[ "$RUNNER_OS" == Linux ]]; then
          archive="$RUNNER_TEMP/flutter.tar.xz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_$FLUTTER_VERSION-stable.tar.xz"
          echo "$LINUX_SHA256  $archive" | sha256sum --check
          tar --extract --xz --file "$archive" --directory "$destination"
        elif [[ "$RUNNER_OS" == macOS ]]; then
          archive="$RUNNER_TEMP/flutter.zip"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_$FLUTTER_VERSION-stable.zip"
          echo "$MACOS_SHA256  $archive" | shasum --algorithm 256 --check
          ditto -x -k "$archive" "$destination"
        else
          echo "Unsupported CI runner: $RUNNER_OS" >&2
          exit 64
        fi

    - name: Export Flutter SDK
      shell: bash
      env:
        FLUTTER_VERSION: ${{ inputs.version }}
      run: |
        flutter_bin="$RUNNER_TOOL_CACHE/lemon-flutter-$FLUTTER_VERSION/flutter/bin/flutter"
        echo "$RUNNER_TOOL_CACHE/lemon-flutter-$FLUTTER_VERSION/flutter/bin" >> "$GITHUB_PATH"
        echo "LEMON_FLUTTER_BIN=$flutter_bin" >> "$GITHUB_ENV"
        "$flutter_bin" --version
