name: Phase 0 checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2
  FLUTTER_LINUX_SHA256: 447878859d01ca9bfdb99a85f245af07ed8a15fedcd9d189c4749e8e92d1f185
  FLUTTER_MACOS_SHA256: b6fd6ba98c8503d5ee06a6670627b5b1c36167ece3427435ec83b66e9b28c6b5

jobs:
  policy:
    name: Policy / schema first
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: 21.0.10+7
          cache: gradle
      - run: ./lemon check --scope policy

  backend-fast:
    name: Backend fast checks
    needs: policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: 21.0.10+7
          cache: gradle
      - run: ./lemon check --scope backend-fast

  flutter-fast:
    name: Flutter fast checks
    needs: policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: 21.0.10+7
          cache: gradle
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
          linux-sha256: ${{ env.FLUTTER_LINUX_SHA256 }}
          macos-sha256: ${{ env.FLUTTER_MACOS_SHA256 }}
      - run: ./lemon check --scope flutter-fast

  generated-drift:
    name: Generated artifact drift
    needs: policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: 21.0.10+7
          cache: gradle
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
          linux-sha256: ${{ env.FLUTTER_LINUX_SHA256 }}
          macos-sha256: ${{ env.FLUTTER_MACOS_SHA256 }}
      - run: ./lemon generate
      - run: git diff --exit-code

  repository-security:
    name: Repository security and dependency integrity
    needs: policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: 21.0.10+7
          cache: gradle
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
          linux-sha256: ${{ env.FLUTTER_LINUX_SHA256 }}
          macos-sha256: ${{ env.FLUTTER_MACOS_SHA256 }}
      - run: ./lemon check --scope repository-security

  contracts:
    name: Contract generation and compatibility
    needs: [backend-fast, flutter-fast, generated-drift, repository-security]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: 21.0.10+7
          cache: gradle
      - run: ./lemon check --scope contracts

  postgres-integration:
    name: PostgreSQL integration
    needs: contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: 21.0.10+7
          cache: gradle
      - run: ./lemon check --scope postgres-integration

  build-smoke:
    name: Build smoke (${{ matrix.targets }})
    needs: postgres-integration
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            targets: android,web
          - runner: macos-15
            targets: ios
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: 21.0.10+7
          cache: gradle
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
          linux-sha256: ${{ env.FLUTTER_LINUX_SHA256 }}
          macos-sha256: ${{ env.FLUTTER_MACOS_SHA256 }}
      - run: ./lemon check --scope build-smoke
        env:
          LEMON_BUILD_TARGETS: ${{ matrix.targets }}

  final-verification:
    name: Final repository verification
    needs: build-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: 21.0.10+7
          cache: gradle
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
          linux-sha256: ${{ env.FLUTTER_LINUX_SHA256 }}
          macos-sha256: ${{ env.FLUTTER_MACOS_SHA256 }}
      - run: ./lemon generate
      - run: git diff --exit-code
      - run: ./lemon test
      - run: ./lemon check
      - run: git diff --exit-code

  pr-gate:
    name: PR gate
    if: always()
    needs: final-verification
    runs-on: ubuntu-24.04
    steps:
      - name: Require every preceding job
        env:
          RESULT: ${{ needs.final-verification.result }}
        run: test "$RESULT" = success
