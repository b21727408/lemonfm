services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: lemon
      POSTGRES_USER: lemon
      POSTGRES_PASSWORD: lemon
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemon -d lemon"]
      interval: 2s
      timeout: 2s
      retries: 20
