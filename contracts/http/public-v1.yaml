                    operationId: op_report_example_01
                    submittedAt: '2030-01-01T12:00:00Z'
                    reasonId: synthetic-reason-example
                    source:
                      kind: EXCHANGE
                      exchangeId: exchange-example
        '200':
          description: Authorized replay of this report registration.
          headers:
