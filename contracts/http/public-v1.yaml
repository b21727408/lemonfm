openapi: 3.1.1
info:
  title: Lemon.fm Consumer API
  version: 0.6.0
  description: >-
    Authored contracts for contact preferences, existing consumer sessions,
    profile reads/changes, first-message submission, participant exchange views,
    replies, history/repair, explicit return, exchange blocking/report registration
    and private list/label controls. Registration, SMS verification, moderation
    outcomes and quiz collections follow their feature slices.
    Backend implementation and Java/Dart binding verification are delivery work.
    This document does not assert that a service is deployed.
security:
  - memberBearer: []
tags:
  - name: ContactPreferences
    description: Safety-owned member settings, separate from request admission.
  - name: Sessions
    description: Identity-owned existing sessions; no profile or contact eligibility.
  - name: Profiles
    description: Profile-owned self and member-visible fields, with separate audiences.
  - name: FirstMessages
    description: Messaging-owned contact context and author-only first-message submissions.
  - name: Exchanges
    description: Participant-safe request, conversation, history and explicit return actions.
  - name: SafetyControls
    description: Participant-authorized blocking, allegation registration and owner recovery; no enforcement outcome API.
paths:
  /v1/me/session:
    get:
      tags: [Sessions]
      operationId: getMySession
      summary: Read the session authorizing this call
      description: >-
        Verify the access credential, family revocation and current account access.
        Return only this session's metadata; never return credentials, phone data,
        another device's session or hidden trust state. A verified active member
        can call before profile setup or quiz completion. accountId is a private
        self-service identifier for account-scoped client state, not a public
        profile or participant identifier. Identity does not call Profile to
        supply onboarding readiness; the host reads getMyProfile separately.
      responses:
        '200':
          description: Current authorized session metadata.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSnapshot'
              example:
                accountId: account-self-example
                sessionId: session-example
                accessTokenExpiresAt: '2030-01-01T12:15:00Z'
                refreshFamilyExpiresAt: '2030-01-31T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '5XX':
          $ref: '#/components/responses/ServiceFailure'
  /v1/auth/refresh:
    post:
      tags: [Sessions]
      operationId: refreshSession
      summary: Rotate an existing refresh credential
      security: []
      description: >-
        Authenticate with the refreshToken in the JSON body; no access bearer
        is required or used to choose the account. The empty OpenAPI security
        override does not remove this credential check. Do not send a stale
        Authorization header. This operation cannot register or recover an account.

        Atomically validate account access and the live family, consume the
        presented credential and issue its successor plus an access credential.
        sessionId and accountId stay the same. The access lifetime is at most
        15 minutes and cannot exceed the family's fixed absolute expiry, 30 days
        from its creation. Rotation does not extend that expiry. Server time,
        not device time, determines validity. Check revocation on every use.

        Reuse of a consumed refresh credential revokes its entire family,
        including concurrently issued successors and access credentials.
        Unknown, expired, revoked, reused or otherwise ineligible credentials
        share 400 AUTH_REFRESH_INVALID without a reason or account disclosure.
        Malformed input uses 400 INVALID_INPUT before rotation. A disclosed
        429 is also returned before rotation and can be retried after its wait.

        Serialize client refresh calls. Do not use an Idempotency-Key, token
        replay response cache or grace window. A timeout, interrupted response
        or 5xx leaves rotation uncertain and requires login again, not a second
        rotation attempt or a credential lookup. Install the complete successor
        state only after protected persistence of the new refresh credential
        and account/session metadata; the access credential can remain in memory.
        A late response after logout or account switch must not restore a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshCredentialInput'
            example: {refreshToken: example-refresh-credential-not-valid}
      responses:
        '200':
          description: Committed rotation; credentials are returned only here.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCredentials'
              example:
                tokenType: Bearer
                accessToken: example-access-credential-not-valid
                refreshToken: example-successor-credential-not-valid
                session:
                  accountId: account-self-example
                  sessionId: session-example
                  accessTokenExpiresAt: '2030-01-01T12:15:00Z'
                  refreshFamilyExpiresAt: '2030-01-31T12:00:00Z'
        '400':
          $ref: '#/components/responses/RefreshRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '5XX':
          $ref: '#/components/responses/RefreshFailure'
  /v1/auth/logout:
    post:
      tags: [Sessions]
      operationId: logoutSession
      summary: Revoke the session family identified by my refresh credential
      security: []
      description: >-
        The presented refreshToken is used only to locate and revoke its family,
        never to issue credentials or reveal identity. No access bearer is
        required, so an expired access token does not prevent logout. A retained
        consumed credential can revoke the same family; it cannot authorize reads.
        Revoke that family's access credentials and refresh successors atomically
        with respect to rotation. Do not revoke another device's family.

        For any syntactically valid input, return 204 after processing, whether
        the credential identified a live, expired, already revoked or unknown
        family. No token-validity oracle, account ID or session data is returned.
        Malformed input uses 400. No Idempotency-Key or response replay record is
        needed: a repeated call can only revoke the same family.

        Clear local account credentials, drafts and private state on explicit
        logout even if the network fails, invalidating in-flight responses.
        A lost response does not prove server revocation. Do not retain a logout
        credential in a new persistent retry queue or silently login to retry.
        A same-credential in-flight retry can only complete this revocation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshCredentialInput'
            example: {refreshToken: example-refresh-credential-not-valid}
      responses:
        '204':
          $ref: '#/components/responses/RevocationComplete'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '5XX':
          $ref: '#/components/responses/ServiceFailure'
  /v1/me/sessions/logout-all:
    post:
      tags: [Sessions]
      operationId: logoutAllSessions
      summary: Revoke all my existing consumer session families
      description: >-
        Authenticate with the current member bearer. Require no account ID,
        target-session list or request body; reject a nonempty body with 400
        INVALID_INPUT. Under the account mutation guard,
        revoke all consumer families existing at commit, including the current
        one, and their access credentials. Session creation and rotation must
        use compatible ordering so neither resurrects a revoked family.
        A later successful login creates a new family; logout-all is not a ban.

        Return 204 only after the revocation commits. A retry with the now-revoked
        bearer receives 401; it cannot authorize more account operations.
        Do not refresh or reauthenticate automatically to retry logout-all,
        and do not store a successful response containing credentials.
        Clear local private state on the explicit action, even if offline.
        A failed or lost response leaves server-wide completion unconfirmed;
        current-session 401 alone cannot prove the status of other devices.
      responses:
        '204':
          $ref: '#/components/responses/RevocationComplete'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '5XX':
          $ref: '#/components/responses/ServiceFailure'
  /v1/me/profile:
    get:
      tags: [Profiles]
      operationId: getMyProfile
      summary: Read my saved profile fields and setup readiness
      description: >-
        Resolve the owner from the active verified member session, including
        before profile setup or quiz completion. Return 200 INCOMPLETE for an
        account with no saved profile: profileId, nickname, cityId and bio are
        null; representation is BLANK; interestIds and promptAnswers are empty.
        Supply an opaque self-profile revision without publishing or allocating
        a public profile merely because it was read.

        Return the current saved profile values, not unapproved moderation
        submissions or another device's unsaved edits. READY requires the
        accepted nickname and a supported selected city. Photo, avatar, bio,
        interests, prompts and quiz completion are not readiness requirements.
        The server computes readiness; a client cannot submit it as permission.

        This view contains Profile-owned fields only. Quiz collection and
        completion views belong to the quiz contract and are not fabricated
        as empty or false here. Catalog IDs identify authored city, interest,
        prompt and representation content; localized catalog reads and media
        delivery are supplied with those features. No phone or trust data.
      responses:
        '200':
          description: Current self profile, with explicit missing setup values.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
              examples:
                beforeSetup:
                  value:
                    revision: profile-initial-example
                    readiness: INCOMPLETE
                    profileId: null
                    nickname: null
                    cityId: null
                    representation: {kind: BLANK}
                    bio: null
                    interestIds: []
                    promptAnswers: []
                readyWithoutQuizOrPhoto:
                  value:
                    revision: profile-r3
                    readiness: READY
                    profileId: profile-example
                    nickname: limon
                    cityId: city-example
                    representation: {kind: BLANK}
                    bio: null
                    interestIds: []
                    promptAnswers: []
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '5XX':
          $ref: '#/components/responses/ServiceFailure'
  /v1/me/profile/changes:
    post:
      tags: [Profiles]
      operationId: submitMyProfileChange
      summary: Submit an immutable profile change, optionally replacing a pending one
      description: >-
        Require the author's active verified account; profile readiness and quiz
        completion are not prerequisites. Resolve ownership from the bearer.
        Validate and normalize the input, then under the account guard compare
        expectedRevision with the current saved profile revision and check any
        pending replacement. Register the candidate, operation digest and durable
        processing work atomically. No provider call runs inside that transaction.

        A pending candidate can be replaced only by explicitly naming its owned
        replacesChangeId. Omitting it while another candidate is active, or naming
        an owned candidate that is no longer the current pending one, yields
        409 PROFILE_CHANGE_CONFLICT. A foreign or missing replacement target
        yields 404 PROFILE_CHANGE_UNAVAILABLE. A successful registration marks
        the old candidate SUPERSEDED in the same commit. Failure before this
        registration leaves it intact. Later rejection or check failure of the
        replacement cannot reactivate the old candidate.

        changes is a complete new patch relative to the saved profile revision,
        not an overlay on the previous candidate. Omitted fields preserve saved
        values; include pending edits the author intends to keep. null clears
        bio only; empty arrays clear interests or prompts; BLANK clears the
        representation. No caller-supplied publication, ownership or trust fields.

        Return 201 for a newly registered candidate, not proof of publication.
        Processing may finish before the response or continue durably afterwards;
        state determines the outcome. A current valid automatically allowed save
        is applied without another Save; human review and nudges have the states
        defined by ProfileChange. Exact published fields still come from getMyProfile.

        Idempotency scope is author plus this operation kind. Bind the digest to
        expectedRevision, replacesChangeId and the normalized patch including
        omission/null/list semantics. A known committed replay returns 200 with
        the same changeId and its currently permitted state before checking stale
        revisions or current pending work; changed payload uses OPERATION_CONFLICT.
        After a lost response, use getMyProfileChangeByOperation. A lookup miss
        while registration is in flight is not proof of failure. Retain domain
        operation uniqueness with the candidate; D4 governs its record lifetime.
      parameters:
        - $ref: '#/components/parameters/ProfileOperationKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitProfileChange'
            examples:
              initialProfile:
                value:
                  expectedRevision: profile-initial-example
                  changes: {nickname: limon, cityId: city-example, representation: {kind: BLANK}}
              clearOptionalFields:
                value:
                  expectedRevision: profile-r3
                  changes: {bio: null, interestIds: [], promptAnswers: []}
              replacePendingEdit:
                value:
                  expectedRevision: profile-r3
                  replacesChangeId: change-example-01
                  changes: {bio: 'Yeni biyografi.', cityId: city-example}
      responses:
        '201':
          $ref: '#/components/responses/ProfileChangeCreated'
        '200':
          $ref: '#/components/responses/ProfileChangeRead'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '404':
          $ref: '#/components/responses/ProfileChangeUnavailable'
        '409':
          $ref: '#/components/responses/ProfileChangeConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '5XX':
          $ref: '#/components/responses/ServiceFailure'
  /v1/me/profile/changes/latest:
    get:
      tags: [Profiles]
      operationId: getMyLatestProfileChange
      summary: Read my latest retained profile submission, including its completed outcome
      description: >-
        Use the same owner access as getMyProfile, including before setup.
        Select by server registration order under the account guard, not device
        time or last status-update time. Return the latest retained candidate
        even when terminal; a live candidate is PROCESSING,
        AWAITING_ACKNOWLEDGEMENT or AWAITING_REVIEW. change is null when no
        candidate is retained. This is neither a history list nor evidence that
        a particular timed-out submission failed; reconcile that operation by ID.
        Reading does not submit, acknowledge, cancel, publish or extend retention.
      responses:
        '200':
          description: Latest retained owner-only submission or an explicit absence.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestProfileChange'
              example: {change: null}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '5XX':
          $ref: '#/components/responses/ServiceFailure'
  /v1/me/profile/changes/by-operation/{operationId}:
    get:
      tags: [Profiles]
      operationId: getMyProfileChangeByOperation
      summary: Recover a profile submission when its creation response was lost
      description: >-
        Lookup only the authenticated author's submitMyProfileChange operation
        namespace. operationId is the Idempotency-Key used for that creation,
        not a diagnostic requestId, cancellation or acknowledgement operation.
        Return the same current authorized projection as getMyProfileChange.
        Missing, inaccessible and no-longer-retained results share 404
        PROFILE_CHANGE_UNAVAILABLE. A 404 while creation may be running is
        inconclusive; do not silently mint a new submission key.
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ProfileOperationId'
      responses:
        '200':
          $ref: '#/components/responses/ProfileChangeRead'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '404':
          $ref: '#/components/responses/ProfileChangeUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '5XX':
          $ref: '#/components/responses/ServiceFailure'
  /v1/me/profile/changes/{changeId}:
    get:
      tags: [Profiles]
      operationId: getMyProfileChange
      summary: Read the current state of my submitted change
      description: >-
        Authorize the candidate owner independently of identifier possession.
        Another member, staff credentials on the consumer route and an anonymous
        request participant cannot read it. A foreign/missing/removed candidate
        has the same 404 PROFILE_CHANGE_UNAVAILABLE. Return current state;
        APPLIED records a historical commit, not the current profile snapshot.
        Retention or safety may omit changes without allowing replay to restore
        withheld text. The response never includes staff evidence or trust state.
      parameters:
        - $ref: '#/components/parameters/ProfileChangeId'
      responses:
        '200':
          $ref: '#/components/responses/ProfileChangeRead'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '404':
          $ref: '#/components/responses/ProfileChangeUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '5XX':
          $ref: '#/components/responses/ServiceFailure'
  /v1/me/profile/changes/{changeId}/acknowledge:
    post:
      tags: [Profiles]
      operationId: acknowledgeMyProfileChange
      summary: Explicitly acknowledge the current warning for my immutable submission
      description: >-
        Require the owner, currently readable candidate content,
        AWAITING_ACKNOWLEDGEMENT state and the exact current nudgeToken, bound
        to this candidate's content, author and policy.
        No edited text is accepted here. Replaced/canceled/otherwise ineligible
        state uses PROFILE_CHANGE_CONFLICT; an obsolete or mismatched challenge
        uses MODERATION_CONTEXT_CHANGED. Read current state and explicitly act
        on a usable prompt or submit a replacement; never auto-acknowledge a new one.

        Record acknowledgement and required continuation work atomically under
        the account guard. Then continue checks outside the transaction as needed;
        acknowledgement is not publication and cannot bypass a rejection, human
        review or current publication predicates. No second Save is needed when
        the still-current candidate becomes fully eligible for application.

        Bind Idempotency-Key to author, this operation kind, changeId and token.
        A known committed replay resolves before current prompt/state checks and
        returns the candidate's permitted current projection without acknowledging
        again. For uncertain results, read this known candidate; if still pending,
        only retry the same action identity and body within the replay rules.
      parameters:
        - $ref: '#/components/parameters/ProfileChangeId'
        - $ref: '#/components/parameters/ProfileOperationKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeProfileChange'
            example: {nudgeToken: example-nudge-token-not-valid}
      responses:
        '200':
          $ref: '#/components/responses/ProfileChangeRead'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '404':
          $ref: '#/components/responses/ProfileChangeUnavailable'
        '409':
          $ref: '#/components/responses/ProfileChangeConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '5XX':
          $ref: '#/components/responses/ServiceFailure'
  /v1/me/profile/changes/{changeId}/cancel:
    post:
      tags: [Profiles]
      operationId: cancelMyProfileChange
      summary: Cancel my still-pending profile change
      description: >-
        Require the candidate owner; reject a nonempty body with 400 INVALID_INPUT.
        Under the account guard, a current PROCESSING, AWAITING_ACKNOWLEDGEMENT
        or AWAITING_REVIEW candidate becomes CANCELED. Repeated cancellation of
        an already CANCELED candidate returns that state. APPLIED, REJECTED,
        NOT_APPLIED or SUPERSEDED yields 409 PROFILE_CHANGE_CONFLICT without a
        cancellation claim. This targets an immutable candidate ID, never the
        account's latest candidate implicitly; a newer replacement is unaffected.

        Bind Idempotency-Key to author, this operation kind and changeId.
        Cancellation, replacement and application have one guarded outcome.
        If cancellation commits first, late results cannot apply it. If application
        commits first, return conflict and let the owner read the actual outcome.
        Resolve a known committed action replay before current state checks,
        returning the same candidate's currently permitted projection.
        Reconcile a lost response by the known candidate ID; keep the original
        action key on retries. Cancellation is not deletion of case evidence;
        D4 governs any retained content and references.
      parameters:
        - $ref: '#/components/parameters/ProfileChangeId'
        - $ref: '#/components/parameters/ProfileOperationKey'
      responses:
        '200':
          $ref: '#/components/responses/ProfileChangeRead'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '404':
          $ref: '#/components/responses/ProfileChangeUnavailable'
        '409':
          $ref: '#/components/responses/ProfileChangeConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '5XX':
          $ref: '#/components/responses/ServiceFailure'
  /v1/profiles/{profileId}:
    get:
      tags: [Profiles]
      operationId: getMemberProfile
      summary: Read member-visible fields of an accessible profile
      description: >-
        Require the caller's active verified account and browsing-ready profile.
        Authorize the target's current member-visible profile under Domain;
        possession of profileId is not authorization. Missing, unpublished or
        otherwise inaccessible targets share 404 PROFILE_UNAVAILABLE with no
        private reason. A caller lacking browsing access receives 403 independently
        of whether the target exists. No public unauthenticated profile lookup.

        Return only accepted, currently visible Profile-owned content. Remove
        retired catalog items and unavailable media references from the current
        view without rewriting historical exchange snapshots. Never expose
        private account/session IDs, self-edit revision, readiness, keyword
        filters, refusal state, an existing exchange ID, or a hidden association
        between this profile and an anonymous participant. This read grants no
        contact permission and does not replace an admission check.

        Quiz collections are composed through their own approved contract;
        absence of a collection field here must not display an empty collection.
        Catalog and media references require their feature's authorized resolver.
        This operation alone does not constitute the complete profile screen.
      parameters:
        - name: profileId
          in: path
          required: true
          description: Public profile resource ID, never a private account or conversation handle.
          schema:
            $ref: '#/components/schemas/OpaqueResourceId'
      responses:
        '200':
          description: Authorized member-visible profile fields.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberProfile'
              example:
                profileId: profile-example
                nickname: limon
                cityId: city-example
                representation: {kind: AVATAR, avatarId: avatar-example}
                bio: null
                interestIds: [interest-example]
                promptAnswers: [{promptId: prompt-example, answer: 'Gece yürüyüşleri.'}]
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '404':
          $ref: '#/components/responses/ProfileUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '5XX':
          $ref: '#/components/responses/ServiceFailure'
  /v1/me/contact-preferences:
    get:
      tags: [ContactPreferences]
      operationId: getMyContactPreferences
      summary: Read my contact preferences
      description: >-
        Resolve the owner exclusively from the authenticated member session.
        No account/profile identifier parameter is accepted. A verified active
        member can manage these settings before completing a quiz or profile.
        An unconfigured door is ANONYMOUS_ALLOWED and the filter list is empty;
        reading these defaults does not create a request or publish a profile.
        Return an opaque revision even when defaults have not been changed.
        Filters are private to this member and never returned to a sender.
      responses:
        '200':
          $ref: '#/components/responses/PreferencesRead'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '5XX':
          $ref: '#/components/responses/ServiceFailure'
    patch:
      tags: [ContactPreferences]
      operationId: updateMyContactPreferences
      summary: Change my door or replace my keyword filters
      description: >-
        Authorize the same member access as GET. Apply all supplied changes
        atomically under the account mutation guard. Require expectedRevision
        from a previous GET or successful PATCH; stale revisions return 409
        REVISION_CONFLICT without a write, even if the desired values match.
        Omitted settings stay unchanged. keywordFilters replaces the whole list;
        [] clears it. null is invalid for every input. Normalize filter text as
        specified in Contracts before validating lengths and storing it; preserve
        entry order and letter case for display. Matching is literal and
        case-folded under Safety. This private settings edit does not publish
        text or require the public-text moderation queue.

        An effective change returns a new opaque revision. A valid no-op with
        the current revision returns the same revision. Changing these settings
        cannot rewrite an accepted exchange's identity mode. A door change takes effect for subsequent
        admissions under Backend's transaction ordering. This operation does
        not decide the pending contact-context/resend protocol.

        This conditional desired-state edit uses revision checking and GET
        reconciliation, not an Idempotency-Key or a generic operation record.
        On a lost response, GET the current settings before another explicit
        save. That read shows current state, not proof that a particular earlier
        PATCH committed. Never silently reapply an edit over a newer revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactPreferences'
            examples:
              changeDoor:
                value:
                  expectedRevision: pref-r7
                  door: PROFILE_REQUIRED
              clearFilters:
                value:
                  expectedRevision: pref-r7
                  keywordFilters: []
      responses:
        '200':
          $ref: '#/components/responses/PreferencesRead'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '5XX':
          $ref: '#/components/responses/ServiceFailure'
  /v1/profiles/{profileId}/contact-context:
    get:
      tags:
      - FirstMessages
      operationId: getFirstMessageContext
      summary: Read the identity and optional anchor context before composing
      description: |-
        Require the caller's active verified account and browsing-ready profile;
        quiz completion is required at submission, not to read this context.
        Independently authorize target profile and contact availability. Missing
        target, inaccessible target, private pair restriction, block and an existing
        open exchange share CONTACT_UNAVAILABLE, without disclosing its identity.

        Supply anchorKind, anchorId and anchorRevision together, or omit all three.
        Partial/null/unknown query fields use INVALID_INPUT. Resolve the selected
        visible collection entry or prompt answer for this target; a changed/removed
        item uses CONTACT_CONTEXT_CHANGED after target authorization. Do not drop it.
        The response echoes only that valid reference; its presentation comes from
        the authorized owning feature. No scoring data or fabricated quiz schema.

        Bind the opaque token to the caller, recipient, current door revision and
        exact optional anchor. It does not select a mode, reserve the pair or certify
        available send allowance. Later actions recheck current authorization and
        relevant revisions. An old read never authorizes sending after a door change.
      parameters:
      - name: profileId
        in: path
        required: true
        schema:
