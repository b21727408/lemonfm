  /v1/exchanges/{exchangeId}/private-preferences:
    get:
      tags:
        - Exchanges
      operationId: getExchangePrivatePreferences
      summary: Read my private exchange list and label preferences
      description: |-
        Require active verified participant read access. Return only this caller's
        saved preferences; hidden defaults false and a receiver conversation label
        defaults null before any edit. The opaque initial revision supports a first
        conditional write without requiring a pre-created empty row. Private decline
        cannot change the original sender's preference shape/revision. Hiding does
        not remove read/report access. A label exists only for the original receiver
        after conversation start, including retained ended/severed conversations.
      parameters:
        - $ref: '#/components/parameters/ExchangeId'
      responses:
        '200':
          $ref: '#/components/responses/PrivatePreferencesRead'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '404':
          $ref: '#/components/responses/ExchangeUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        5XX:
          $ref: '#/components/responses/ServiceFailure'
    patch:
      tags:
        - Exchanges
      operationId: updateExchangePrivatePreferences
      summary: Set my hidden state and permitted private label atomically
      description: |-
        Require current active participant read access, independently of contact
        eligibility or peer access. Check this caller's private expectedRevision;
        conflict returns REVISION_CONFLICT with no write. Apply every supplied field
        together; omission preserves values, false restores ordinary list visibility
        and null clears only an eligible receiver's label. Label fields, including
        null, are INVALID_INPUT for a request or original sender. A retained receiver
        conversation permits a label irrespective of active/ended/severed lifecycle.

        Hiding affects only this member's list: exclude hidden rows from ordinary
        groups and retrieve them through view=HIDDEN. It does not decline/end, release
        the pair, delete history, suppress existing notification policy or unhide on
        a peer message. Restoring visibility returns the row to its current permitted
        group. A private label changes only this receiver's list/header, never the
        system handle, shared history, peer view, notification to the peer or safety
        evidence. Neither edit advances shared lifecycle or history progress.

        This is a conditional desired-state edit, not an idempotent creation. No
        Idempotency-Key or receipt is required; no-op edits may retain the revision.
        After a lost response, read current preferences and preserve newer edits;
        do not replay an old overwrite after silently refreshing its revision.
      parameters:
        - $ref: '#/components/parameters/ExchangeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivatePreferencesPatch'
            example:
              expectedRevision: private-revision-example
              hidden: true
              privateLabel: Gece yürüyüşü
      responses:
        '200':
          $ref: '#/components/responses/PrivatePreferencesRead'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '404':
          $ref: '#/components/responses/ExchangeUnavailable'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        5XX:
          $ref: '#/components/responses/ServiceFailure'
components:
  parameters:
    SafetyOperationKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/SafetyOperationId'
      description: Original author-scoped BLOCK or REPORT action key. Bind to the full target and normalized
        consequential input.
    ExchangeId:
      name: exchangeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueResourceId'
      description: Known exchange identity. Possession or knowledge of a profile association does not
        grant participant access.
    ExchangeOperationKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/ExchangeOperationId'
      description: Retain for retries of this exact author/kind/target/body. A distinct deliberate action
        uses a new key.
    FirstMessageOperationKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/FirstMessageOperationId'
      description: A new key for a distinct explicit action; keep the same key and body for permitted
        retries. Not a credential.
    FirstMessageSubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueResourceId'
      description: Immutable submission identity. Resolve author ownership independently.
    ProfileOperationKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Nonpersonal random action identity, retained across retries of this exact
        action. A different user action gets a new key. Never an access credential.
      schema:
        $ref: '#/components/schemas/ProfileOperationId'
    ProfileChangeId:
      name: changeId
      in: path
      required: true
      description: An immutable profile-submission identity; ownership is checked separately.
      schema:
        $ref: '#/components/schemas/OpaqueResourceId'
  securitySchemes:
    memberBearer:
      type: http
      scheme: bearer
      description: >-
        Opaque consumer access token in Authorization. Staff and restricted
        appeal credentials do not grant member settings access.
  schemas:
    SafetyOperationId:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
      description: Random private action identity. Scope to the author and BLOCK or REPORT namespace;
        retain across retries, never expose to the reported/blocked peer.
    SafetyCursor:
      type: string
      minLength: 1
      maxLength: 4096
      description: Opaque integrity-protected cursor bound to account and list scope/order. Contains no
        decodable hidden account association and is excluded from diagnostics.
    AnonymousRequestSafetyContext:
      type: object
      additionalProperties: false
      required:
        - kind
        - exchangeId
      properties:
        kind:
          type: string
          enum:
            - ANONYMOUS_REQUEST
        exchangeId:
          $ref: '#/components/schemas/OpaqueResourceId'
      description: Known anonymous incoming request context; no pre-conversation handle, profile fields
        or reusable account alias.
    AnonymousConversationSafetyContext:
      type: object
      additionalProperties: false
      required:
        - kind
        - exchangeId
        - handle
      properties:
        kind:
          type: string
          enum:
            - ANONYMOUS_CONVERSATION
        exchangeId:
          $ref: '#/components/schemas/OpaqueResourceId'
        handle:
          type: string
          minLength: 1
          maxLength: 128
      description: Only the anonymous handle already visible in this retained conversation; never a shared
        account identity or a later open-profile upgrade.
    OpenSafetyExchangeContext:
      type: object
      additionalProperties: false
      required:
        - kind
        - exchangeId
        - peer
      properties:
        kind:
          type: string
          enum:
            - OPEN_EXCHANGE
        exchangeId:
          $ref: '#/components/schemas/OpaqueResourceId'
        peer:
          $ref: '#/components/schemas/VisibleExchangePeer'
      description: Use only where this caller already knew this profile-to-exchange association. Resolve
        current permitted profile data through its owning API; no copied stale photo or nickname.
    UnavailableSafetyContext:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - UNAVAILABLE
      description: Context is no longer readable. No private cause, substitute profile association or
        permission to drop the retained block.
    BlockedContext:
      oneOf:
        - $ref: '#/components/schemas/AnonymousRequestSafetyContext'
        - $ref: '#/components/schemas/AnonymousConversationSafetyContext'
        - $ref: '#/components/schemas/OpenSafetyExchangeContext'
        - $ref: '#/components/schemas/UnavailableSafetyContext'
      discriminator:
        propertyName: kind
        mapping:
          ANONYMOUS_REQUEST: '#/components/schemas/AnonymousRequestSafetyContext'
          ANONYMOUS_CONVERSATION: '#/components/schemas/AnonymousConversationSafetyContext'
          OPEN_EXCHANGE: '#/components/schemas/OpenSafetyExchangeContext'
          UNAVAILABLE: '#/components/schemas/UnavailableSafetyContext'
    BlockRecord:
      type: object
      additionalProperties: false
      required:
        - blockId
        - createdAt
        - context
      properties:
        blockId:
          $ref: '#/components/schemas/OpaqueResourceId'
        createdAt:
          type: string
          format: date-time
          description: Creation of this author/context record, not the earliest account-pair block.
        context:
          $ref: '#/components/schemas/BlockedContext'
      description: The caller’s own block context. blockId is scoped to this caller and known exchange,
        not reused across otherwise unlinked anonymous contexts. This record remains separate from the
        internal account-level block.
    BlockActionReceipt:
      type: object
      additionalProperties: false
      required:
        - operationId
        - blockId
        - exchangeId
        - committedAt
      properties:
        operationId:
          $ref: '#/components/schemas/SafetyOperationId'
        blockId:
          $ref: '#/components/schemas/OpaqueResourceId'
        exchangeId:
          $ref: '#/components/schemas/OpaqueResourceId'
        committedAt:
          type: string
          format: date-time
          description: Commit of this author’s action; no counterpart block timestamp.
      description: Author-only historical confirmation of account-level blocking through this known exchange.
        No newlyBlocked flag, affected-thread list, hidden account ID or current peer state.
    BlockListPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/BlockRecord'
        nextCursor:
          $ref: '#/components/schemas/SafetyCursor'
    ReportTargetKind:
      type: string
      enum:
        - EXCHANGE
        - MESSAGE
    ReportLocale:
      type: string
      enum:
        - tr
        - en
    ReportReasonId:
      type: string
      minLength: 1
      maxLength: 128
      description: Stable authored reason identity, never a trust score or classifier/enforcement code.
        Exact vocabulary is approved with D5; synthetic examples do not select it.
    ReportReasonCatalogRevision:
      type: string
      minLength: 1
      maxLength: 128
      description: Opaque identity of the displayed target-specific reason catalog revision; not an account/lifecycle
        revision.
    ReportReasonOption:
      type: object
      additionalProperties: false
      required:
        - reasonId
        - label
      properties:
        reasonId:
          $ref: '#/components/schemas/ReportReasonId'
        label:
          type: string
          minLength: 1
      description: Plain localized authored reason label, never executable markup. Exact labels and taxonomy
        require the D5 moderation design.
    ReportReasonCatalog:
      type: object
      additionalProperties: false
      required:
        - revision
        - targetKind
        - locale
        - items
      properties:
        revision:
          $ref: '#/components/schemas/ReportReasonCatalogRevision'
        targetKind:
          $ref: '#/components/schemas/ReportTargetKind'
        locale:
          $ref: '#/components/schemas/ReportLocale'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReportReasonOption'
      description: One complete configured reason catalog for this target and locale. IDs are unique.
        No hardcoded report taxonomy or penalty mapping is implied by this transport shape.
    ReportInput:
      type: object
      additionalProperties: false
      required:
        - reasonId
        - reasonCatalogRevision
      properties:
        reasonId:
          $ref: '#/components/schemas/ReportReasonId'
        reasonCatalogRevision:
          $ref: '#/components/schemas/ReportReasonCatalogRevision'
        context:
          type: string
          minLength: 1
          maxLength: 1000
          description: Optional author-written context under the existing report-text limit; NFC and outer
            trim, Unicode scalar counting. Omit empty normalized context. Not a replacement for server-resolved
            evidence.
    ExchangeReportSource:
      type: object
      additionalProperties: false
      required:
        - kind
        - exchangeId
      properties:
        kind:
          type: string
          enum:
            - EXCHANGE
        exchangeId:
          $ref: '#/components/schemas/OpaqueResourceId'
    MessageReportSource:
      type: object
      additionalProperties: false
      required:
        - kind
        - exchangeId
        - messageId
      properties:
        kind:
          type: string
          enum:
            - MESSAGE
        exchangeId:
          $ref: '#/components/schemas/OpaqueResourceId'
        messageId:
          $ref: '#/components/schemas/OpaqueResourceId'
      description: Message must belong to this exchange and be authored by the peer; caller-supplied text
        or authorship is not evidence.
    ReportSource:
      oneOf:
        - $ref: '#/components/schemas/ExchangeReportSource'
        - $ref: '#/components/schemas/MessageReportSource'
      discriminator:
        propertyName: kind
        mapping:
          EXCHANGE: '#/components/schemas/ExchangeReportSource'
          MESSAGE: '#/components/schemas/MessageReportSource'
    ReportReceipt:
      type: object
      additionalProperties: false
      required:
        - reportId
        - operationId
        - submittedAt
        - reasonId
      properties:
        reportId:
          $ref: '#/components/schemas/OpaqueResourceId'
        operationId:
          $ref: '#/components/schemas/SafetyOperationId'
        submittedAt:
          type: string
          format: date-time
          description: Report registration commit, not a moderation or enforcement decision.
        reasonId:
          $ref: '#/components/schemas/ReportReasonId'
        source:
          $ref: '#/components/schemas/ReportSource'
      description: Reporter-only historical receipt. Confirms receipt of an allegation, not that review
        has begun/finished or a violation was found. No staff evidence, accused identity, enforcement
        status or investigation time. Source can be omitted when no longer permitted; outcome interfaces
        await D5.
    ReportListPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ReportReceipt'
        nextCursor:
          $ref: '#/components/schemas/SafetyCursor'
    PrivatePreferenceRevision:
      type: string
      minLength: 1
      maxLength: 128
      description: Opaque revision of this participant’s saved exchange preferences and permitted edit
        shape. It is separate from shared lifecycle and never advanced by a peer’s private edits or silent
        decline.
    PrivateConversationLabel:
      type: string
      minLength: 1
      maxLength: 80
      description: Receiver-authored private display label, after NFC normalization and outer trimming
        in Unicode scalar values. Never the system handle or proof of identity; null in an edit clears
        it.
    RequestPrivatePreferences:
      type: object
      additionalProperties: false
      required:
        - kind
        - exchangeId
        - revision
        - hidden
      properties:
        kind:
          type: string
          enum:
            - REQUEST
        exchangeId:
          $ref: '#/components/schemas/OpaqueResourceId'
        revision:
          $ref: '#/components/schemas/PrivatePreferenceRevision'
        hidden:
          type: boolean
      description: Either participant’s request-list preference. A sender cannot infer pending versus
        privately closed from kind/revision/hidden.
    SenderConversationPrivatePreferences:
      type: object
      additionalProperties: false
      required:
        - kind
        - exchangeId
        - revision
        - hidden
      properties:
        kind:
          type: string
          enum:
            - SENDER_CONVERSATION
        exchangeId:
          $ref: '#/components/schemas/OpaqueResourceId'
        revision:
          $ref: '#/components/schemas/PrivatePreferenceRevision'
        hidden:
          type: boolean
      description: Original sender’s private list preference; no private-label capability under Domain.
    ReceiverConversationPrivatePreferences:
      type: object
      additionalProperties: false
      required:
        - kind
        - exchangeId
        - revision
        - hidden
        - privateLabel
      properties:
        kind:
          type: string
          enum:
            - RECEIVER_CONVERSATION
        exchangeId:
          $ref: '#/components/schemas/OpaqueResourceId'
        revision:
          $ref: '#/components/schemas/PrivatePreferenceRevision'
        hidden:
          type: boolean
        privateLabel:
          oneOf:
            - $ref: '#/components/schemas/PrivateConversationLabel'
            - type: 'null'
      description: Original receiver’s own list/header preferences. Label is null when clear. Works for
        retained active, ended and severed conversations.
    ExchangePrivatePreferences:
      oneOf:
        - $ref: '#/components/schemas/RequestPrivatePreferences'
        - $ref: '#/components/schemas/SenderConversationPrivatePreferences'
        - $ref: '#/components/schemas/ReceiverConversationPrivatePreferences'
      discriminator:
        propertyName: kind
        mapping:
          REQUEST: '#/components/schemas/RequestPrivatePreferences'
          SENDER_CONVERSATION: '#/components/schemas/SenderConversationPrivatePreferences'
          RECEIVER_CONVERSATION: '#/components/schemas/ReceiverConversationPrivatePreferences'
    PrivatePreferencesPatch:
      type: object
      additionalProperties: false
      required:
        - expectedRevision
      properties:
        expectedRevision:
          $ref: '#/components/schemas/PrivatePreferenceRevision'
        hidden:
          type: boolean
        privateLabel:
          oneOf:
            - $ref: '#/components/schemas/PrivateConversationLabel'
            - type: 'null'
      anyOf:
        - required:
            - hidden
        - required:
            - privateLabel
      description: One atomic desired-state edit. Omitted fields are preserved; null clears only the receiver’s
        label. Label fields, including null, are rejected for requests and original senders. No peer state,
        system-handle rename or message/lifecycle mutation.
    ExchangeOperationId:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
      description: Random nonpersonal action identity, retained across retries. Never a credential or
        a peer-visible message attribute.
    ExchangeOperationKind:
      type: string
      enum:
        - REPLY
        - DECLINE
        - RETURN_REPLY
        - RETURN_MESSAGE
        - RESUME
        - SEND
        - END
    ExchangeLifecycleRevision:
      type: string
      minLength: 1
      maxLength: 128
      description: Opaque revision of the lifecycle visible to this participant. Changes across close/return/resume
        cycles, not for an ordinary new message. Never expose the receiver-private request revision to
        the original sender.
    MessageSequence:
      type: string
      pattern: ^[1-9][0-9]*$
      description: Positive canonical decimal creation-order sequence within one exchange; parse as an
        integer, never lexically or with floating point. Immutable per admitted message. Not a synchronization
        cursor or a peer read position.
    ExchangeCursor:
      type: string
      minLength: 1
      maxLength: 4096
      description: Opaque, integrity-protected cursor bound to caller, exchange/list scope, traversal
        kind and position. Not authorization. Do not expose private account IDs or receiver-only activity
        even if decoded; exclude from diagnostics.
    OpenExchangePeer:
      type: object
      additionalProperties: false
      required:
        - kind
        - profileId
        - nickname
        - representation
      properties:
        kind:
          type: string
          enum:
            - OPEN
        profileId:
          $ref: '#/components/schemas/OpaqueResourceId'
        nickname:
          $ref: '#/components/schemas/Nickname'
        representation:
          $ref: '#/components/schemas/ProfileRepresentation'
      description: Currently permitted open-profile summary. Compose through Profile API; never return
        an account DTO or use this variant for a hidden anonymous sender.
    UnavailableExchangePeer:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - UNAVAILABLE
      description: An open peer representation is currently unavailable. No private cause, cached profile
        link or replacement identity.
    VisibleExchangePeer:
      oneOf:
        - $ref: '#/components/schemas/OpenExchangePeer'
        - $ref: '#/components/schemas/UnavailableExchangePeer'
      discriminator:
        propertyName: kind
        mapping:
          OPEN: '#/components/schemas/OpenExchangePeer'
          UNAVAILABLE: '#/components/schemas/UnavailableExchangePeer'
    AnonymousRequestPeer:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - ANONYMOUS
      description: An anonymous initial sender has no profile fields, reusable alias or pre-conversation
        handle in the incoming request.
    AnonymousConversationPeer:
      type: object
      additionalProperties: false
      required:
        - kind
        - handle
      properties:
        kind:
          type: string
          enum:
            - ANONYMOUS
        handle:
          type: string
          minLength: 1
          maxLength: 128
          description: System-assigned conversation-scoped anonymous handle. Stable in this conversation,
            unrelated across conversations, never derived from a profile/account identifier.
    IncomingRequestPeer:
      oneOf:
        - $ref: '#/components/schemas/OpenExchangePeer'
        - $ref: '#/components/schemas/UnavailableExchangePeer'
        - $ref: '#/components/schemas/AnonymousRequestPeer'
      discriminator:
        propertyName: kind
        mapping:
          OPEN: '#/components/schemas/OpenExchangePeer'
          UNAVAILABLE: '#/components/schemas/UnavailableExchangePeer'
          ANONYMOUS: '#/components/schemas/AnonymousRequestPeer'
    ConversationPeer:
      oneOf:
        - $ref: '#/components/schemas/OpenExchangePeer'
        - $ref: '#/components/schemas/UnavailableExchangePeer'
        - $ref: '#/components/schemas/AnonymousConversationPeer'
      discriminator:
        propertyName: kind
        mapping:
          OPEN: '#/components/schemas/OpenExchangePeer'
          UNAVAILABLE: '#/components/schemas/UnavailableExchangePeer'
          ANONYMOUS: '#/components/schemas/AnonymousConversationPeer'
    SharedPointSnapshot:
      type: object
      additionalProperties: false
      required:
        - kind
        - label
      properties:
        kind:
          type: string
          enum:
            - RESULT
            - INTEREST
        label:
          type: string
          minLength: 1
      description: Permitted named shared point from admission-time context. A label, not a trait vector,
        match count or compatibility claim. No sender collection or profile association.
    AnchorSnapshot:
      type: object
      additionalProperties: false
      required:
        - kind
        - heading
        - text
      properties:
        kind:
          type: string
          enum:
            - RESULT
            - PROMPT_ANSWER
        heading:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
      description: Permitted localized snapshot of the selected result or prompt answer. Current profile
        edits do not replace its historical meaning; safety/retention may withhold it. No scoring formula
        or sender identity fields.
    ExchangeContextSnapshot:
      type: object
      additionalProperties: false
      required: []
      properties:
        anchor:
          $ref: '#/components/schemas/AnchorSnapshot'
        sharedPoints:
          type: array
          items:
            $ref: '#/components/schemas/SharedPointSnapshot'
      description: Currently permitted admission-time context. Withheld portions are omitted; absence
        cannot prove no anchor/shared point originally existed. No private redaction reason or hidden-item
        count.
    ExchangeTextMessage:
      type: object
      additionalProperties: false
      required:
        - kind
        - messageId
        - sequence
        - sentAt
        - author
        - text
      properties:
        kind:
          type: string
          enum:
            - TEXT
            - RETURN_OFFER
        messageId:
          $ref: '#/components/schemas/OpaqueResourceId'
        sequence:
          $ref: '#/components/schemas/MessageSequence'
        sentAt:
          type: string
          format: date-time
          description: RFC 3339 UTC message admission time, never peer-read time.
        author:
          type: string
          enum:
            - SELF
            - PEER
        text:
          type: string
          minLength: 1
          maxLength: 2000
      description: Current permitted message text. First requests still obey the 500-character input cap.
        RETURN_OFFER is only the explicit return to an ended conversation; a first reply after silent
        decline is ordinary TEXT. No operation key, global participant ID or receipt/read state.
    UnavailableExchangeMessage:
      type: object
      additionalProperties: false
      required:
        - kind
        - messageId
        - sequence
        - sentAt
        - author
      properties:
        kind:
          type: string
          enum:
            - UNAVAILABLE
        messageId:
          $ref: '#/components/schemas/OpaqueResourceId'
        sequence:
          $ref: '#/components/schemas/MessageSequence'
        sentAt:
          type: string
          format: date-time
          description: RFC 3339 UTC message admission time, never peer-read time.
        author:
          type: string
          enum:
            - SELF
            - PEER
      description: Known retained message whose body is unavailable. Do not render an empty successful
        message or restore cached text. No private reason, original body or original message kind.
    ExchangeMessage:
      oneOf:
        - $ref: '#/components/schemas/ExchangeTextMessage'
        - $ref: '#/components/schemas/UnavailableExchangeMessage'
      discriminator:
        propertyName: kind
        mapping:
          TEXT: '#/components/schemas/ExchangeTextMessage'
          RETURN_OFFER: '#/components/schemas/ExchangeTextMessage'
          UNAVAILABLE: '#/components/schemas/UnavailableExchangeMessage'
    InitialExchangeMessage:
      allOf:
        - $ref: '#/components/schemas/ExchangeMessage'
        - properties:
            kind:
              type: string
              enum:
                - TEXT
                - UNAVAILABLE
    OutgoingRequestView:
      type: object
      additionalProperties: false
      required:
        - kind
        - exchangeId
        - identityMode
        - sentAt
        - peer
      properties:
        kind:
          type: string
          enum:
            - OUTGOING_REQUEST
        exchangeId:
          $ref: '#/components/schemas/OpaqueResourceId'
        identityMode:
          $ref: '#/components/schemas/ContactIdentityMode'
        sentAt:
          type: string
          format: date-time
          description: Historical first-message admission instant, unchanged by silent decline or receiver
            folder changes.
        peer:
          $ref: '#/components/schemas/VisibleExchangePeer'
        firstMessage:
          $ref: '#/components/schemas/InitialExchangeMessage'
        context:
          $ref: '#/components/schemas/ExchangeContextSnapshot'
      description: 'Original sender view before a conversation begins. Historical sent fact only: no pending/declined/closed
        state, private lifecycle revision, refusal timestamp or action list. It remains in the outgoing
        group after silent decline. Withheld content is omitted.'
      allOf:
        - properties:
            firstMessage:
              properties:
                author:
                  type: string
                  enum:
                    - SELF
    IncomingRequestView:
      type: object
      additionalProperties: false
      required:
        - kind
        - exchangeId
        - identityMode
        - state
        - lifecycleRevision
        - sentAt
        - peer
        - folder
        - allowedActions
      properties:
        kind:
          type: string
          enum:
            - INCOMING_REQUEST
        exchangeId:
          $ref: '#/components/schemas/OpaqueResourceId'
        identityMode:
          $ref: '#/components/schemas/ContactIdentityMode'
        state:
          type: string
          enum:
            - PENDING
            - CLOSED
        lifecycleRevision:
          $ref: '#/components/schemas/ExchangeLifecycleRevision'
        sentAt:
          type: string
          format: date-time
          description: First-message admission instant.
        peer:
          $ref: '#/components/schemas/IncomingRequestPeer'
        folder:
          type: string
          enum:
            - MAIN
            - FILTERED
        matchedKeywordFilters:
          $ref: '#/components/schemas/KeywordFilters'
        allowedActions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - REPLY
              - DECLINE
              - RETURN_REPLY
        firstMessage:
          $ref: '#/components/schemas/InitialExchangeMessage'
        context:
          $ref: '#/components/schemas/ExchangeContextSnapshot'
      description: Original receiver-only request projection. Folder and matching own filter text never
        appear in sender views. Allowed actions are current hints for these authored routes, not an access
        grant or the complete Safety feature surface.
      allOf:
        - properties:
            firstMessage:
              properties:
                author:
                  type: string
                  enum:
                    - PEER
        - if:
            properties:
              identityMode:
                type: string
                enum:
                  - ANONYMOUS_SENDER
          then:
            properties:
              peer:
                $ref: '#/components/schemas/AnonymousRequestPeer'
          else:
            properties:
              peer:
                $ref: '#/components/schemas/VisibleExchangePeer'
        - if:
            properties:
              state:
                type: string
                enum:
                  - PENDING
          then:
            properties:
              allowedActions:
                items:
                  type: string
                  enum:
                    - REPLY
                    - DECLINE
          else:
            properties:
              allowedActions:
                items:
                  type: string
                  enum:
                    - RETURN_REPLY
        - if:
            required:
              - matchedKeywordFilters
          then:
            properties:
              folder:
                type: string
                enum:
                  - FILTERED
    ConversationView:
      type: object
      additionalProperties: false
      required:
        - kind
        - exchangeId
        - identityMode
        - selfRole
        - state
        - lifecycleRevision
        - peer
        - allowedActions
      properties:
        kind:
          type: string
          enum:
            - CONVERSATION
        exchangeId:
          $ref: '#/components/schemas/OpaqueResourceId'
        identityMode:
          $ref: '#/components/schemas/ContactIdentityMode'
        selfRole:
          type: string
          enum:
            - ORIGINAL_SENDER
            - ORIGINAL_RECEIVER
        state:
          type: string
          enum:
            - ACTIVE
            - AWAITING_RETURN_REPLY
            - ENDED
            - SEVERED
        lifecycleRevision:
          $ref: '#/components/schemas/ExchangeLifecycleRevision'
        peer:
          $ref: '#/components/schemas/ConversationPeer'
        allowedActions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - SEND
              - END
              - RETURN_MESSAGE
              - RESUME
        returnMessageId:
          $ref: '#/components/schemas/OpaqueResourceId'
        context:
          $ref: '#/components/schemas/ExchangeContextSnapshot'
        privateLabel:
          $ref: '#/components/schemas/PrivateConversationLabel'
      description: Participant-safe conversation lifecycle. Identity mode and original roles never reverse
        on return. A lifecycle revision protects the observed conversation cycle without conflicting on
        each new message. A hidden anonymous profile cannot appear through peer fallback. privateLabel
        is an optional current original-receiver-only presentation value; omit it when clear or for the
        original sender. Never treat it as peer identity or advance shared lifecycle/history when it changes.
      allOf:
        - if:
            properties:
              identityMode:
                type: string
                enum:
                  - ANONYMOUS_SENDER
              selfRole:
                type: string
                enum:
                  - ORIGINAL_RECEIVER
          then:
            properties:
              peer:
                $ref: '#/components/schemas/AnonymousConversationPeer'
          else:
            properties:
              peer:
                $ref: '#/components/schemas/VisibleExchangePeer'
        - if:
            properties:
              state:
                type: string
                enum:
                  - AWAITING_RETURN_REPLY
          then:
            required:
              - returnMessageId
          else:
            not:
              required:
                - returnMessageId
        - if:
            properties:
              state:
                type: string
                enum:
                  - ACTIVE
          then:
            properties:
              allowedActions:
                items:
                  type: string
                  enum:
                    - SEND
                    - END
        - if:
            properties:
              state:
                type: string
                enum:
                  - SEVERED
          then:
            properties:
              allowedActions:
                maxItems: 0
        - if:
            properties:
              state:
                type: string
                enum:
                  - ENDED
          then:
            properties:
              allowedActions:
                items:
                  type: string
                  enum:
                    - RETURN_MESSAGE
        - if:
            properties:
              selfRole:
                type: string
                enum:
                  - ORIGINAL_SENDER
          then:
            properties:
              allowedActions:
                items:
                  not:
                    type: string
                    enum:
                      - RETURN_MESSAGE
        - if:
            properties:
              state:
                type: string
                enum:
                  - AWAITING_RETURN_REPLY
              selfRole:
                type: string
                enum:
                  - ORIGINAL_RECEIVER
          then:
            properties:
              allowedActions:
                items:
                  type: string
                  enum:
                    - END
        - if:
            properties:
              state:
                type: string
                enum:
                  - AWAITING_RETURN_REPLY
              selfRole:
                type: string
                enum:
                  - ORIGINAL_SENDER
          then:
            properties:
              allowedActions:
                items:
                  type: string
                  enum:
                    - RESUME
                    - END
        - if:
            properties:
              selfRole:
                type: string
                enum:
                  - ORIGINAL_SENDER
          then:
            not:
              required:
                - privateLabel
    ExchangeView:
      oneOf:
        - $ref: '#/components/schemas/OutgoingRequestView'
        - $ref: '#/components/schemas/IncomingRequestView'
        - $ref: '#/components/schemas/ConversationView'
      discriminator:
        propertyName: kind
        mapping:
          OUTGOING_REQUEST: '#/components/schemas/OutgoingRequestView'
          INCOMING_REQUEST: '#/components/schemas/IncomingRequestView'
          CONVERSATION: '#/components/schemas/ConversationView'
    ExchangeListPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ExchangeView'
        nextCursor:
          $ref: '#/components/schemas/ExchangeCursor'
    ExchangeTextInput:
      type: object
      additionalProperties: false
      required:
        - expectedLifecycleRevision
        - text
      properties:
        expectedLifecycleRevision:
          $ref: '#/components/schemas/ExchangeLifecycleRevision'
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: Member-authored text after NFC normalization and outer trimming, measured in Unicode
            scalar values. No target, author or identity selector.
    ExchangeStateInput:
      type: object
      additionalProperties: false
      required:
        - expectedLifecycleRevision
      properties:
        expectedLifecycleRevision:
          $ref: '#/components/schemas/ExchangeLifecycleRevision'
    ExchangeMessageReference:
      type: object
      additionalProperties: false
      required:
        - messageId
        - sequence
      properties:
        messageId:
          $ref: '#/components/schemas/OpaqueResourceId'
        sequence:
          $ref: '#/components/schemas/MessageSequence'
      description: Committed message identity/order only. Retention may remove the body; this reference
        cannot restore it.
    ExchangeActionReceipt:
      type: object
      additionalProperties: false
      required:
        - operationId
        - operationKind
        - exchangeId
        - committedAt
      properties:
        operationId:
          $ref: '#/components/schemas/ExchangeOperationId'
        operationKind:
          $ref: '#/components/schemas/ExchangeOperationKind'
        exchangeId:
          $ref: '#/components/schemas/OpaqueResourceId'
        committedAt:
          type: string
          format: date-time
          description: RFC 3339 UTC instant of this action’s commit, not the latest exchange state.
        message:
          $ref: '#/components/schemas/ExchangeMessageReference'
      description: Current permitted receipt for this author’s committed action. Not a peer-visible event,
        current-state promise or cached message body. A return reply’s operation kind is private to the
        returning receiver.
      allOf:
        - if:
            properties:
              operationKind:
                type: string
                enum:
                  - REPLY
                  - RETURN_REPLY
                  - RETURN_MESSAGE
                  - RESUME
                  - SEND
          then:
            required:
              - message
          else:
            not:
              required:
                - message
    InitialExchangeHistoryPage:
      type: object
      additionalProperties: false
      required:
        - kind
        - items
        - recoveryCursor
        - exchange
      properties:
        kind:
          type: string
          enum:
            - INITIAL
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ExchangeMessage'
        nextCursor:
          $ref: '#/components/schemas/ExchangeCursor'
        recoveryCursor:
          $ref: '#/components/schemas/ExchangeCursor'
        exchange:
          $ref: '#/components/schemas/ExchangeView'
      description: Recent retained messages in ascending creation order, current participant view and
        matching recovery boundary from one consistent authorized read. nextCursor traverses older messages;
        it is not the recovery cursor.
    OlderExchangeHistoryPage:
      type: object
      additionalProperties: false
      required:
        - kind
        - items
      properties:
        kind:
          type: string
          enum:
            - OLDER
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ExchangeMessage'
        nextCursor:
          $ref: '#/components/schemas/ExchangeCursor'
      description: Older history only, read with current content authorization. Deliberately contains
        no new recovery cursor or lifecycle snapshot; loading an older page cannot skip live changes.
    ExchangeHistoryPage:
      oneOf:
        - $ref: '#/components/schemas/InitialExchangeHistoryPage'
        - $ref: '#/components/schemas/OlderExchangeHistoryPage'
      discriminator:
        propertyName: kind
        mapping:
          INITIAL: '#/components/schemas/InitialExchangeHistoryPage'
          OLDER: '#/components/schemas/OlderExchangeHistoryPage'
    UpsertExchangeMessage:
      type: object
      additionalProperties: false
      required:
        - kind
        - message
      properties:
        kind:
          type: string
          enum:
            - UPSERT_MESSAGE
        message:
          $ref: '#/components/schemas/ExchangeMessage'
      description: Current permitted projection of a message, never an old unredacted journal payload.
    RemoveExchangeMessage:
      type: object
      additionalProperties: false
      required:
        - kind
        - messageId
      properties:
        kind:
          type: string
          enum:
            - REMOVE_MESSAGE
        messageId:
          $ref: '#/components/schemas/OpaqueResourceId'
      description: Remove retained client content for this message ID; no private deletion reason or replacement
        body.
    ExchangeHistoryChange:
      oneOf:
        - $ref: '#/components/schemas/UpsertExchangeMessage'
        - $ref: '#/components/schemas/RemoveExchangeMessage'
      discriminator:
        propertyName: kind
        mapping:
          UPSERT_MESSAGE: '#/components/schemas/UpsertExchangeMessage'
          REMOVE_MESSAGE: '#/components/schemas/RemoveExchangeMessage'
    ExchangeChangesPage:
      type: object
      additionalProperties: false
      required:
        - changes
        - recoveryCursor
        - hasMore
        - exchange
      properties:
        changes:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ExchangeHistoryChange'
        recoveryCursor:
          $ref: '#/components/schemas/ExchangeCursor'
        hasMore:
          type: boolean
        exchange:
          $ref: '#/components/schemas/ExchangeView'
      description: Ordered permitted repair changes and a fresh participant lifecycle view. Empty changes
        may still advance a valid repair boundary. hasMore=false means caught up at this read boundary,
        not permanent absence of future messages. No receiver-read acknowledgement.
    FirstMessageOperationId:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
      description: Random nonpersonal client action identity, kept unchanged on retries. Syntax is not
        proof of randomness or authorization.
    ContactContextToken:
      type: string
      minLength: 1
      maxLength: 4096
      description: Opaque integrity-protected binding of caller, recipient, displayed door revision
        and exact optional anchor. No private account identity or restriction reason may be exposed
        even by decoding it. Not an access credential or capacity reservation. Never normalize, log
        or put in a URL.
    ContactAnchorReference:
      type: object
      additionalProperties: false
      required:
      - kind
      - id
      - revision
      properties:
        kind:
          type: string
          enum:
          - RESULT
          - PROMPT_ANSWER
        id:
          $ref: '#/components/schemas/OpaqueResourceId'
        revision:
          type: string
          minLength: 1
          maxLength: 128
          description: Observed revision of the selected visible collection entry or prompt answer;
            removal/re-addition invalidates its previous context.
      description: 'Reference resolved inside the target profile: RESULT identifies a displayed collection
        entry, PROMPT_ANSWER an authored prompt answer. Does not define quiz scoring or carry caller-authored
        snapshot text.'
    ContactIdentityMode:
      type: string
      enum:
      - ANONYMOUS_SENDER
      - OPEN
      description: 'Server-derived mode: anonymous sender/open receiver, or both open. Unknown values
        disable sending. Never a caller-selectable preference.'
    ContactContext:
      type: object
      additionalProperties: false
      required:
      - targetProfileId
      - contextToken
      - identityMode
      properties:
        targetProfileId:
          $ref: '#/components/schemas/OpaqueResourceId'
        contextToken:
          $ref: '#/components/schemas/ContactContextToken'
        identityMode:
          $ref: '#/components/schemas/ContactIdentityMode'
        anchor:
          $ref: '#/components/schemas/ContactAnchorReference'
      description: Currently permitted composer context, not a guarantee of later admission. An absent
        anchor means an explicitly unanchored composition; no hidden thread or private restriction details.
    SubmitFirstMessage:
      type: object
      additionalProperties: false
      required:
      - targetProfileId
      - contextToken
      - text
      properties:
        targetProfileId:
          $ref: '#/components/schemas/OpaqueResourceId'
        contextToken:
          $ref: '#/components/schemas/ContactContextToken'
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: Member-authored text, NFC-normalized and outer-trimmed; count Unicode scalar
            values. No generated sender persona or caller-authored snapshot.
        anchor:
          $ref: '#/components/schemas/ContactAnchorReference'
        replacesSubmissionId:
          $ref: '#/components/schemas/OpaqueResourceId'
      description: Immutable first-message version. anchor is omitted only for an unanchored composition;
        null is invalid. Replacement targets a still-live owned version for this same recipient. No
        sender account, identity-mode selector, quota, trust or accepted timestamp is accepted.
    ContinueFirstMessage:
      type: object
      additionalProperties: false
      required:
      - contextToken
      properties:
        contextToken:
          $ref: '#/components/schemas/ContactContextToken'
      description: Freshly displayed context for the same recipient and exact immutable anchor. The
        explicit action can consent to a changed door mode; it cannot silently edit or drop the anchor
        or text.
    AcknowledgeFirstMessage:
      type: object
      additionalProperties: false
      required:
      - contextToken
      - nudgeToken
      properties:
        contextToken:
          $ref: '#/components/schemas/ContactContextToken'
        nudgeToken:
          type: string
          minLength: 1
          maxLength: 4096
          description: Exact current challenge for this author, submission content and policy; exclude
            from diagnostics.
    SubmittedFirstMessageContent:
      type: object
      additionalProperties: false
      required:
      - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        targetProfileId:
          $ref: '#/components/schemas/OpaqueResourceId'
        anchor:
          $ref: '#/components/schemas/ContactAnchorReference'
      description: Author-only permitted projection of submitted content. Omit withheld content or target/anchor
        references. Missing references are not an invitation to substitute another recipient or remove
        the anchor. A usable current context is still required to send.
    FirstMessageNudge:
      type: object
      additionalProperties: false
      required:
      - code
      - reasonCode
      - nudgeToken
      properties:
        code:
          type: string
          enum:
          - CONTENT_NUDGE_REQUIRED
        reasonCode:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Z][A-Z0-9_]*$
          description: Safe policy-mapped reason. CONTENT_CAUTION is generic; unknown categories show
            a generic caution and never auto-acknowledge. Detailed policy mappings remain D5.
        nudgeToken:
          type: string
          minLength: 1
          maxLength: 4096
    FirstMessageProblem:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          enum:
          - CONTENT_NOT_ALLOWED
          - CONTACT_UNAVAILABLE
          - CONTACT_CONTEXT_CHANGED
          - QUIZ_REQUIRED
          - REQUEST_LIMIT_REACHED
          - SERVICE_UNAVAILABLE
          - ACCESS_UNAVAILABLE
        retryAt:
          type: string
          format: date-time
          description: Optional RFC 3339 UTC guidance for a disclosed own allowance or service failure,
            never a private pair/refusal/enforcement expiry. Not a guarantee of future admission.
      description: Terminal unsent outcome, not an HTTP read failure or a receiver decline. No private
        reason, peer identifier, quota amount, trust state, provider score or staff evidence.
      allOf:
      - if:
          required:
          - retryAt
        then:
          properties:
            code:
              type: string
              enum:
              - REQUEST_LIMIT_REACHED
              - SERVICE_UNAVAILABLE
    FirstMessageAdmission:
      type: object
      additionalProperties: false
      required:
      - sentAt
      - identityMode
      properties:
        sentAt:
          type: string
          format: date-time
          description: RFC 3339 UTC server admission instant; never updated to peer activity time.
        identityMode:
          $ref: '#/components/schemas/ContactIdentityMode'
        exchangeId:
          $ref: '#/components/schemas/OpaqueResourceId'
        messageId:
          $ref: '#/components/schemas/OpaqueResourceId'
      description: Historical committed-send receipt, not delivery, reading or current inbox state.
        Omit both resource IDs if current safety/retention authorization withholds the links. Receiver
        decline alone cannot alter this projection.
      dependentRequired:
        exchangeId:
        - messageId
        messageId:
        - exchangeId
    FirstMessageSubmission:
      type: object
      additionalProperties: false
      required:
      - submissionId
      - operationId
      - state
      - stateVersion
      - createdAt
      - updatedAt
      properties:
        submissionId:
          $ref: '#/components/schemas/OpaqueResourceId'
        operationId:
          $ref: '#/components/schemas/FirstMessageOperationId'
        state:
          type: string
          enum:
          - PROCESSING
          - AWAITING_ACKNOWLEDGEMENT
          - AWAITING_REVIEW
          - READY_TO_SEND
          - SENT
          - REJECTED
          - NOT_SENT
          - CANCELED
          - SUPERSEDED
        stateVersion:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Positive canonical decimal counter for author-visible submission updates. Compare
            as an integer within this submission only; no floating-point conversion. Never advance for
            receiver reading, filtering or decline.
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 UTC submission registration instant.
        updatedAt:
          type: string
          format: date-time
          description: RFC 3339 UTC last author-visible submission update; not exchange activity.
        content:
          $ref: '#/components/schemas/SubmittedFirstMessageContent'
        nudge:
          $ref: '#/components/schemas/FirstMessageNudge'
        problem:
          $ref: '#/components/schemas/FirstMessageProblem'
        admission:
          $ref: '#/components/schemas/FirstMessageAdmission'
      description: |-
        Owner-only submission resource. The first four states are live. SENT proves
        historical admission; it never means still pending in the receiver's inbox.
        Terminal versions do not reactivate. READY_TO_SEND is content approval awaiting
        an explicit Send, not contact permission. Unknown states disable mutations.
        Withheld content is omitted, not restored from an old response or local cache.
      allOf:
      - if:
          required:
          - nudge
        then:
          required:
          - content
          properties:
            state:
              type: string
              enum:
              - AWAITING_ACKNOWLEDGEMENT
            content:
              required:
              - targetProfileId
      - if:
          required:
          - content
          properties:
            state:
              type: string
              enum:
              - AWAITING_ACKNOWLEDGEMENT
            content:
              required:
              - targetProfileId
        then:
          required:
          - nudge
      - if:
          properties:
            state:
              type: string
              enum:
              - SENT
        then:
          required:
          - admission
        else:
          not:
            required:
            - admission
      - if:
          properties:
            state:
              type: string
              enum:
              - REJECTED
              - NOT_SENT
        then:
          required:
          - problem
        else:
          not:
            required:
            - problem
      - if:
          properties:
            state:
              type: string
              enum:
              - REJECTED
        then:
          properties:
            problem:
              properties:
                code:
                  type: string
                  enum:
                  - CONTENT_NOT_ALLOWED
        else:
          properties:
            problem:
              properties:
                code:
                  not:
                    type: string
                    enum:
                    - CONTENT_NOT_ALLOWED
    FirstMessageSubmissionPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/FirstMessageSubmission'
        nextCursor:
          type: string
          minLength: 1
          maxLength: 4096
    ProfileOperationId:
      type: string
      minLength: 16
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
      description: >-
        Client-generated action identity. Its syntax is a transport constraint,
        not proof of randomness or ownership. UUID-style keys are suitable.
    ProfileRepresentationChange:
      oneOf:
        - $ref: '#/components/schemas/BlankRepresentation'
        - $ref: '#/components/schemas/AvatarRepresentation'
        - $ref: '#/components/schemas/ProfilePhotoChange'
      discriminator:
        propertyName: kind
        mapping:
          BLANK: '#/components/schemas/BlankRepresentation'
          AVATAR: '#/components/schemas/AvatarRepresentation'
          PHOTO: '#/components/schemas/ProfilePhotoChange'
      description: >-
        Proposed representation. BLANK clears it; an avatar must be active.
        This value cannot set or change an exchange's anonymity mode.
    ProfilePhotoChange:
      type: object
      additionalProperties: false
      required: [kind, mediaId]
      properties:
        kind:
          type: string
          enum: [PHOTO]
        mediaId:
          $ref: '#/components/schemas/OpaqueResourceId'
      description: >-
        Reference to this author's ready, inspected media, independently checked
        again at application. Registering the candidate does not publish that
        media. Never accept an upload grant, storage key or arbitrary URL here.
    ProfileChangeFields:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        Proposed patch, not a public profile DTO. Omission preserves the saved
        field. Normalize member text with NFC and outer trimming before length
        validation; an empty normalized bio means null. Catalog IDs and media
        references are opaque and are not text-normalized. Lists replace whole
        lists and do not implicitly merge a previous pending patch.
      properties:
        nickname:
          type: string
          minLength: 3
          maxLength: 24
          description: >-
            Proposed nickname, not yet moderated or reserved. Runtime validation
            enforces Contracts' Unicode letter/digit and separator rules; database
            uniqueness is checked again at application. Cannot be cleared with null.
        cityId:
          $ref: '#/components/schemas/OpaqueResourceId'
        representation:
          $ref: '#/components/schemas/ProfileRepresentationChange'
        bio:
          type: [string, 'null']
          maxLength: 280
          description: null or normalized empty text clears the bio; omission preserves it.
        interestIds:
          $ref: '#/components/schemas/ProfileInterestIds'
          description: Proposed catalog selections, rechecked for availability at application.
        promptAnswers:
          type: array
          maxItems: 3
          description: >-
            Proposed complete prompt-answer list; [] clears it. Each promptId
            must occur only once and identify an active authored prompt.
          items:
            type: object
            additionalProperties: false
            required: [promptId, answer]
            properties:
              promptId:
                $ref: '#/components/schemas/OpaqueResourceId'
              answer:
                type: string
                minLength: 1
                maxLength: 160
    SubmitProfileChange:
      type: object
      additionalProperties: false
      required: [expectedRevision, changes]
      properties:
        expectedRevision:
          type: string
          minLength: 1
          maxLength: 128
          description: Current saved-profile revision from getMyProfile, including its initial revision.
        replacesChangeId:
          $ref: '#/components/schemas/OpaqueResourceId'
        changes:
          $ref: '#/components/schemas/ProfileChangeFields'
    AcknowledgeProfileChange:
      type: object
      additionalProperties: false
      required: [nudgeToken]
      properties:
        nudgeToken:
          type: string
          minLength: 1
          maxLength: 4096
          description: Exact currently displayed challenge; neither normalize nor log it.
    ProfileChangeNudge:
      type: object
      additionalProperties: false
      required: [code, reasonCode, nudgeToken]
      properties:
        code:
          type: string
          enum: [CONTENT_NUDGE_REQUIRED]
        reasonCode:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: >-
            Safe policy-mapped category, never a raw provider label. CONTENT_CAUTION
            is the generic category; unknown categories render a generic caution,
            never automatic acknowledgement. Detailed mappings belong to D5.
        nudgeToken:
          type: string
          minLength: 1
          maxLength: 4096
          description: >-
            Opaque challenge bound to the exact author, candidate, content and
            policy. Not a bearer credential. Requires owner authorization and
            current readable content; exclude from logs, analytics and URLs.
        fields:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [nickname, bio, promptAnswers]
    ProfileChangeProblem:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum:
            - CONTENT_NOT_ALLOWED
            - REVISION_CONFLICT
            - NICKNAME_UNAVAILABLE
            - CATALOG_UNAVAILABLE
            - MEDIA_UNAVAILABLE
            - SERVICE_UNAVAILABLE
            - PROFILE_CHANGE_UNAVAILABLE
        fields:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [nickname, cityId, representation, bio, interestIds, promptAnswers]
      description: >-
        Safe terminal candidate outcome, not an HTTP failure to read the resource.
        Never include raw provider errors, private input, staff evidence or trust
        labels. SERVICE_UNAVAILABLE is a failed content check, not content rejection.
    ProfileChange:
      type: object
      additionalProperties: false
      required: [changeId, operationId, expectedRevision, state, stateVersion, createdAt, updatedAt]
      description: >-
        Owner-only current projection of an immutable submitted patch. State and
        safe disclosure can advance without changing the submitted content.
        An HTTP 2xx means the requested resource operation succeeded; only APPLIED
        records a completed save. APPLIED is not proof of browsing readiness or
        that these remain the current published values. Read getMyProfile for both.
        The response is not a moderation-evidence or general account model.
      properties:
        changeId:
          $ref: '#/components/schemas/OpaqueResourceId'
        operationId:
          $ref: '#/components/schemas/ProfileOperationId'
        expectedRevision:
          type: string
          minLength: 1
          maxLength: 128
          description: Saved-profile revision against which this immutable patch was submitted.
        state:
          type: string
          enum: [PROCESSING, AWAITING_ACKNOWLEDGEMENT, AWAITING_REVIEW, APPLIED, REJECTED, NOT_APPLIED, CANCELED, SUPERSEDED]
          description: >-
            PROCESSING covers pending automatic checks or final application work.
            AWAITING_REVIEW is not approval or publication. REJECTED is a content
            decision; NOT_APPLIED is a technical failure or a failed current
            publication predicate. Only the first three states are live.
            Terminal candidates never reactivate; retry/correction is an explicit
            new submission. Unknown states disable mutation and trigger reconciliation.
        stateVersion:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: >-
            Positive canonical decimal counter increasing with each visible state,
            prompt or disclosure change. Compare as an integer only within this
            changeId; ignore older responses. It is not the saved-profile revision
            or authorization, and cannot order different candidates.
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 UTC instant of candidate registration.
        updatedAt:
          type: string
          format: date-time
          description: RFC 3339 UTC instant of the latest visible candidate update.
        changes:
          $ref: '#/components/schemas/ProfileChangeFields'
        nudge:
          $ref: '#/components/schemas/ProfileChangeNudge'
        problem:
          $ref: '#/components/schemas/ProfileChangeProblem'
        appliedRevision:
          type: string
          minLength: 1
          maxLength: 128
          description: Revision produced by this save, possibly unchanged for a no-op; not necessarily current now.
        appliedAt:
          type: string
          format: date-time
          description: RFC 3339 UTC instant when the complete save committed.
      allOf:
        - if:
            required: [nudge]
          then:
            required: [changes]
            properties:
              state: {enum: [AWAITING_ACKNOWLEDGEMENT]}
        - if:
            required: [changes]
            properties:
              state: {enum: [AWAITING_ACKNOWLEDGEMENT]}
          then:
            required: [nudge]
        - if:
            properties:
              state: {enum: [APPLIED]}
          then:
            required: [appliedRevision, appliedAt]
          else:
            not:
              anyOf:
                - required: [appliedRevision]
                - required: [appliedAt]
        - if:
            properties:
              state: {enum: [REJECTED, NOT_APPLIED]}
          then:
            required: [problem]
          else:
            not:
              required: [problem]
        - if:
            properties:
              state: {enum: [REJECTED]}
          then:
            properties:
              problem:
                properties:
                  code: {enum: [CONTENT_NOT_ALLOWED]}
          else:
            properties:
              problem:
                properties:
                  code:
                    not: {enum: [CONTENT_NOT_ALLOWED]}
    LatestProfileChange:
      type: object
      additionalProperties: false
      required: [change]
      properties:
        change:
          anyOf:
            - $ref: '#/components/schemas/ProfileChange'
            - type: 'null'
    OpaqueResourceId:
      type: string
      minLength: 1
      maxLength: 128
      description: >-
        Nonpersonal opaque resource identifier. Resource-specific ownership and
        authorization still apply; IDs are not interchangeable credentials.
    SessionSnapshot:
      type: object
      additionalProperties: false
      required: [accountId, sessionId, accessTokenExpiresAt, refreshFamilyExpiresAt]
      properties:
        accountId:
          type: string
          minLength: 1
          maxLength: 128
          description: Private own-account identifier; forbidden in member-profile and peer views.
        sessionId:
          $ref: '#/components/schemas/OpaqueResourceId'
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: RFC 3339 UTC expiry of the access token associated with this response.
        refreshFamilyExpiresAt:
          type: string
          format: date-time
          description: Fixed RFC 3339 UTC absolute family expiry; never extended by rotation.
    RefreshCredentialInput:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: >-
            Opaque credential. Do not trim, normalize, decode into identity,
            log, include in URLs or persist outside protected credential storage.
    SessionCredentials:
      type: object
      additionalProperties: false
      required: [tokenType, accessToken, refreshToken, session]
      description: >-
        Secret-bearing response. Exclude credential values from HTTP logs,
        crash reports, generated-object diagnostics and application analytics.
        Install one consistent account-scoped state; persist the refresh
        credential and session metadata in protected storage while the access
        credential can remain in memory.
      properties:
        tokenType:
          type: string
          enum: [Bearer]
        accessToken:
          type: string
          minLength: 1
          maxLength: 4096
          description: Opaque access credential; not a JWT or a public identifier.
        refreshToken:
          type: string
          minLength: 1
          maxLength: 4096
          description: Newly issued opaque refresh credential; never a consumed predecessor.
        session:
          $ref: '#/components/schemas/SessionSnapshot'
    Nickname:
      type: string
      minLength: 3
      maxLength: 24
      description: >-
        Accepted NFC-normalized nickname. Domain and Contracts also require
        Unicode letters/digits with single dot/underscore/hyphen separators,
        none at either end, and case-folded uniqueness. Length validation alone
        does not implement those Unicode-category or database rules.
    ProfileRepresentation:
      oneOf:
        - $ref: '#/components/schemas/BlankRepresentation'
        - $ref: '#/components/schemas/AvatarRepresentation'
        - $ref: '#/components/schemas/PhotoRepresentation'
      discriminator:
        propertyName: kind
        mapping:
          BLANK: '#/components/schemas/BlankRepresentation'
          AVATAR: '#/components/schemas/AvatarRepresentation'
          PHOTO: '#/components/schemas/PhotoRepresentation'
      description: >-
        Current member-visible representation, unrelated to an exchange's
        anonymity mode. Unknown variants use a neutral unavailable visual,
        never a guessed photo/profile association or a submitted replacement.
    BlankRepresentation:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [BLANK]
    AvatarRepresentation:
      type: object
      additionalProperties: false
      required: [kind, avatarId]
      properties:
        kind:
          type: string
          enum: [AVATAR]
        avatarId:
          $ref: '#/components/schemas/OpaqueResourceId'
    PhotoRepresentation:
      type: object
      additionalProperties: false
      required: [kind, mediaId]
      properties:
        kind:
          type: string
          enum: [PHOTO]
        mediaId:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            Approved published media reference, never a storage key, original
            upload grant, external URL or unreviewed upload. Delivery must
            independently enforce the media feature's current authorization.
    ProfileInterestIds:
      type: array
      maxItems: 5
      uniqueItems: true
      description: Currently selected active catalog identities, not arbitrary labels or inferred traits.
      items:
        $ref: '#/components/schemas/OpaqueResourceId'
    ProfilePromptAnswers:
      type: array
      maxItems: 3
      description: >-
        Accepted answers to active authored prompts. Each promptId occurs at
        most once; the server enforces uniqueness by that property rather than
        treating two different answers to the same prompt as different items.
      items:
        type: object
        additionalProperties: false
        required: [promptId, answer]
        properties:
          promptId:
            $ref: '#/components/schemas/OpaqueResourceId'
          answer:
            type: string
            minLength: 1
            maxLength: 160
            description: Accepted normalized member text; not an unreviewed submission.
    MyProfile:
      type: object
      additionalProperties: false
      required: [revision, readiness, profileId, nickname, cityId, representation, bio, interestIds, promptAnswers]
      description: >-
        Owner-only view. Nullable setup fields distinguish missing values from
        a read failure. READY must agree with saved nickname, supported city
        and an allocated public profileId; verify this semantic invariant in
        runtime tests. Reading readiness does not grant access to another API.
      properties:
        revision:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            Opaque revision of this member's saved Profile-owned fields only.
            It is not a contact-preference, collection or admission revision.
        readiness:
          type: string
          enum: [INCOMPLETE, READY]
        profileId:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          description: null until a public profile resource exists; not the private accountId.
        nickname:
          anyOf:
            - $ref: '#/components/schemas/Nickname'
            - type: 'null'
        cityId:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          description: Self-selected coarse city catalog identity, or null before selection.
        representation:
          $ref: '#/components/schemas/ProfileRepresentation'
        bio:
          type: [string, 'null']
          minLength: 1
          maxLength: 280
          description: Accepted bio, or null when none is displayed.
        interestIds:
          $ref: '#/components/schemas/ProfileInterestIds'
        promptAnswers:
          $ref: '#/components/schemas/ProfilePromptAnswers'
    MemberProfile:
      type: object
      additionalProperties: false
      required: [profileId, nickname, cityId, representation, bio, interestIds, promptAnswers]
      description: >-
        Public-to-eligible-members projection, never an account DTO or an
        anonymous-exchange participant view. Self-only fields cannot be added
        merely because the caller happens to own the requested profile.
      properties:
        profileId:
          $ref: '#/components/schemas/OpaqueResourceId'
        nickname:
          $ref: '#/components/schemas/Nickname'
        cityId:
          $ref: '#/components/schemas/OpaqueResourceId'
        representation:
          $ref: '#/components/schemas/ProfileRepresentation'
        bio:
          type: [string, 'null']
          minLength: 1
          maxLength: 280
        interestIds:
          $ref: '#/components/schemas/ProfileInterestIds'
        promptAnswers:
          $ref: '#/components/schemas/ProfilePromptAnswers'
    PreferenceRevision:
      type: string
      minLength: 1
      maxLength: 128
      description: >-
        Opaque token for this member's complete contact-preference state.
        Compare only for equality. It is neither an identity nor permission
        to read settings, and is not a request's contact-context revision.
    DoorMode:
      type: string
      enum: [ANONYMOUS_ALLOWED, PROFILE_REQUIRED]
      description: >-
        The receiver's policy for new requests. ANONYMOUS_ALLOWED always means
        anonymous sender and open receiver; the sender cannot select a mode.
        Unknown values must disable door editing pending reconciliation,
        never fall back to a different identity mode.
    KeywordFilters:
      type: array
      maxItems: 20
      description: >-
        Private literal filters, in submitted order. Limits apply after NFC
        normalization and outer-whitespace trimming, counting Unicode scalar
        values. Matching uses case folding without regex interpretation.
        Repeated entries are allowed and count toward the entry limit.
      items:
        type: string
        minLength: 2
        maxLength: 40
    ContactPreferences:
      type: object
      additionalProperties: false
      required: [revision, door, keywordFilters]
      properties:
        revision:
          $ref: '#/components/schemas/PreferenceRevision'
        door:
          $ref: '#/components/schemas/DoorMode'
        keywordFilters:
          $ref: '#/components/schemas/KeywordFilters'
    UpdateContactPreferences:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      minProperties: 2
      description: >-
        Supply expectedRevision and at least one setting. All properties are
        non-nullable. Reject additional fields; do not silently ignore an
        attempted owner, trust-state or receipt-setting mutation.
      properties:
        expectedRevision:
          $ref: '#/components/schemas/PreferenceRevision'
        door:
          $ref: '#/components/schemas/DoorMode'
        keywordFilters:
          $ref: '#/components/schemas/KeywordFilters'
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - requestId
      properties:
        code:
          type: string
          enum:
            - EXCHANGE_UNAVAILABLE
            - EXCHANGE_CONTEXT_CHANGED
            - EXCHANGE_OPERATION_UNAVAILABLE
            - HISTORY_CURSOR_RESET_REQUIRED
            - INVALID_INPUT
            - AUTHENTICATION_REQUIRED
            - ACCESS_UNAVAILABLE
            - REVISION_CONFLICT
            - RATE_LIMITED
            - SERVICE_UNAVAILABLE
            - AUTH_REFRESH_INVALID
            - PROFILE_UNAVAILABLE
            - CONTACT_UNAVAILABLE
            - CONTACT_CONTEXT_CHANGED
            - QUIZ_REQUIRED
            - REQUEST_LIMIT_REACHED
            - FIRST_MESSAGE_UNAVAILABLE
            - FIRST_MESSAGE_CONFLICT
            - PROFILE_CHANGE_UNAVAILABLE
            - PROFILE_CHANGE_CONFLICT
            - MODERATION_CONTEXT_CHANGED
            - OPERATION_CONFLICT
            - BLOCK_UNAVAILABLE
            - REPORT_UNAVAILABLE
            - REPORT_TARGET_UNAVAILABLE
            - REPORT_REASON_CHANGED
        requestId:
          type: string
          minLength: 1
          description: Nonpersonal diagnostic correlation identifier.
        violations:
          type: array
          description: Present only for INVALID_INPUT when safe field details are useful. Never echo submitted
            text, unknown property names or credentials.
          items:
            type: object
            additionalProperties: false
            required:
              - field
              - reason
            properties:
              field:
                type: string
                enum:
                  - body
                  - expectedRevision
                  - door
                  - keywordFilters
                  - refreshToken
                  - profileId
                  - changeId
                  - operationId
                  - idempotencyKey
                  - replacesChangeId
                  - changes
                  - changes.nickname
                  - changes.cityId
                  - changes.representation
                  - changes.bio
                  - changes.interestIds
                  - changes.promptAnswers
                  - nudgeToken
                  - targetProfileId
                  - contextToken
                  - text
                  - anchor
                  - anchorKind
                  - anchorId
                  - anchorRevision
                  - submissionId
                  - replacesSubmissionId
                  - cursor
                  - limit
                  - exchangeId
                  - operationKind
                  - expectedLifecycleRevision
                  - view
                  - folder
                  - blockId
                  - reportId
                  - messageId
                  - targetKind
                  - locale
                  - reasonId
                  - reasonCatalogRevision
                  - context
                  - hidden
                  - privateLabel
              reason:
                type: string
                enum:
                  - REQUIRED
                  - INVALID
                  - TOO_SHORT
                  - TOO_LONG
                  - TOO_MANY
                  - UNEXPECTED_FIELD
        retryAt:
          type: string
          format: date-time
          description: Optional RFC 3339 UTC instant, only for a disclosed technical rate limit, own accepted-request
            allowance or temporary service retry. Never a hidden enforcement or refusal expiry. Consistent
            with Retry-After when both appear.
  headers:
    NoStore:
      description: Required on every response from these operations.
      schema:
        type: string
        enum: [no-store]
    RetryAfter:
      description: >-
        Optional disclosed wait in non-negative integer seconds. Match retryAt
        if both are supplied. Absence does not authorize immediate blind retry.
      schema:
        type: string
        pattern: '^[0-9]+$'
  responses:
    BlockCommitted:
      description: Account-level protection, required exchange transitions and this action receipt committed
        atomically, or this authorized action was replayed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BlockActionReceipt'
          examples:
            committed:
              value:
                operationId: op_block_example_01
                blockId: block-context-example
                exchangeId: exchange-example
                committedAt: '2030-01-01T12:00:00Z'
    BlockRead:
      description: Current permitted projection of this caller’s known block context.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BlockRecord'
          examples:
            anonymous:
              value:
                blockId: block-context-example
                createdAt: '2030-01-01T12:00:00Z'
                context:
                  kind: ANONYMOUS_CONVERSATION
                  exchangeId: exchange-example
                  handle: conversation-local-example
            unavailable:
              value:
                blockId: block-context-example
                createdAt: '2030-01-01T12:00:00Z'
                context:
                  kind: UNAVAILABLE
    BlockUnavailable:
      description: BLOCK_UNAVAILABLE for absent/foreign/removed block record or operation in the caller’s
        scope. No account-pair lookup or peer history.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiError'
              - properties:
                  code:
                    type: string
                    enum:
                      - BLOCK_UNAVAILABLE
                not:
                  anyOf:
                    - required:
                        - retryAt
                    - required:
                        - violations
    SafetyOperationConflict:
      description: OPERATION_CONFLICT for a committed key reused against a changed target or consequential
        payload. No second mutation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiError'
              - properties:
                  code:
                    type: string
                    enum:
                      - OPERATION_CONFLICT
                not:
                  anyOf:
                    - required:
                        - retryAt
                    - required:
                        - violations
    ReportRead:
      description: Reporter-only historical registration receipt; this is not a review/outcome response.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportReceipt'
          examples:
            received:
              value:
                reportId: report-example
                operationId: op_report_example_01
                submittedAt: '2030-01-01T12:00:00Z'
                reasonId: synthetic-reason-example
                source:
                  kind: MESSAGE
                  exchangeId: exchange-example
                  messageId: message-example
    ReportUnavailable:
      description: REPORT_UNAVAILABLE for absent/foreign/removed report or creation action in this caller’s
        scope.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiError'
              - properties:
                  code:
                    type: string
                    enum:
                      - REPORT_UNAVAILABLE
                not:
                  anyOf:
                    - required:
                        - retryAt
                    - required:
                        - violations
    ReportTargetUnavailable:
      description: REPORT_TARGET_UNAVAILABLE for missing/unreadable exchange or message, wrong parent,
        nonparticipant or a message not authored by the peer. No target details or private causes.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiError'
              - properties:
                  code:
                    type: string
                    enum:
                      - REPORT_TARGET_UNAVAILABLE
                not:
                  anyOf:
                    - required:
                        - retryAt
                    - required:
                        - violations
    ReportInputConflict:
      description: REPORT_REASON_CHANGED for a stale/withdrawn reason catalog; OPERATION_CONFLICT for
        changed committed operation input. No report registered. Refresh reasons, preserve context and
        require explicit resubmission.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiError'
              - properties:
                  code:
                    type: string
                    enum:
                      - REPORT_REASON_CHANGED
                      - OPERATION_CONFLICT
                not:
                  anyOf:
                    - required:
                        - retryAt
                    - required:
                        - violations
    PrivatePreferencesRead:
      description: Only the current caller’s saved preferences and permitted editing shape.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExchangePrivatePreferences'
          examples:
            receiver:
              value:
                kind: RECEIVER_CONVERSATION
                exchangeId: exchange-example
                revision: private-revision-example
                hidden: false
                privateLabel: null
            request:
              value:
                kind: REQUEST
                exchangeId: exchange-example
                revision: private-revision-example
                hidden: false
    ExchangeRead:
      description: Current participant view; its branch is determined by server authorization and visible
        lifecycle, never a caller-selected audience.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExchangeView'
          examples:
            anonymousIncoming:
              value:
                kind: INCOMING_REQUEST
                exchangeId: exchange-example
                identityMode: ANONYMOUS_SENDER
                state: PENDING
                lifecycleRevision: receiver-cycle-1
                sentAt: '2030-01-01T12:00:00Z'
                peer:
                  kind: ANONYMOUS
                folder: MAIN
                allowedActions:
                  - REPLY
                  - DECLINE
                firstMessage:
                  kind: TEXT
                  messageId: message-first
                  sequence: '1'
                  sentAt: '2030-01-01T12:00:00Z'
                  author: PEER
                  text: Bu sonuç sende de çıktı mı?
                context:
                  sharedPoints:
                    - kind: INTEREST
                      label: Gece yürüyüşleri
            outgoingBeforeOrAfterSilentDecline:
              value:
                kind: OUTGOING_REQUEST
                exchangeId: exchange-example
                identityMode: ANONYMOUS_SENDER
                sentAt: '2030-01-01T12:00:00Z'
                peer:
                  kind: OPEN
                  profileId: profile-example
                  nickname: limon
                  representation:
                    kind: BLANK
                firstMessage:
                  kind: TEXT
                  messageId: message-first
                  sequence: '1'
                  sentAt: '2030-01-01T12:00:00Z'
                  author: SELF
                  text: Bu sonuç sende de çıktı mı?
            anonymousConversation:
              value:
                kind: CONVERSATION
                exchangeId: exchange-example
                identityMode: ANONYMOUS_SENDER
                selfRole: ORIGINAL_RECEIVER
                state: ACTIVE
                lifecycleRevision: conversation-cycle-1
                peer:
                  kind: ANONYMOUS
                  handle: conversation-local-example
                allowedActions:
                  - SEND
                  - END
            returnerWaiting:
              value:
                kind: CONVERSATION
                exchangeId: exchange-example
                identityMode: ANONYMOUS_SENDER
                selfRole: ORIGINAL_RECEIVER
                state: AWAITING_RETURN_REPLY
                lifecycleRevision: conversation-cycle-3
                peer:
                  kind: ANONYMOUS
                  handle: conversation-local-example
                allowedActions:
                  - END
                returnMessageId: message-return
    ExchangeActionCommitted:
      description: This action committed, or a known committed action was replayed while authorized. Read
        the exchange for its current state. A receipt does not mean a peer read the message.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExchangeActionReceipt'
          examples:
            reply:
              value:
                operationId: op_exchange_example_01
                operationKind: REPLY
                exchangeId: exchange-example
                committedAt: '2030-01-01T12:01:00Z'
                message:
                  messageId: message-reply
                  sequence: '2'
            decline:
              value:
                operationId: op_exchange_example_01
                operationKind: DECLINE
                exchangeId: exchange-example
                committedAt: '2030-01-01T12:01:00Z'
    ExchangeUnavailable:
      description: EXCHANGE_UNAVAILABLE for missing/inaccessible exchange, nonparticipant, ungranted actor
        role or currently unavailable contact. Do not disclose a hidden inbox state, private cause or
        another exchange.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiError'
              - properties:
                  code:
                    type: string
                    enum:
                      - EXCHANGE_UNAVAILABLE
                not:
                  anyOf:
                    - required:
                        - violations
                    - required:
                        - retryAt
          examples:
            unavailable:
              value:
                code: EXCHANGE_UNAVAILABLE
                requestId: req-exchange-example
    ExchangeContextConflict:
      description: EXCHANGE_CONTEXT_CHANGED for a stale visible lifecycle or an action incompatible with
        that visible phase; OPERATION_CONFLICT for key reuse with different input/target. This call committed
        no mutation. Read current permitted state; do not silently resend across a lifecycle change.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiError'
              - properties:
                  code:
                    type: string
                    enum:
                      - EXCHANGE_CONTEXT_CHANGED
                      - OPERATION_CONFLICT
                not:
                  anyOf:
                    - required:
                        - violations
                    - required:
                        - retryAt
          examples:
            staleCycle:
              value:
                code: EXCHANGE_CONTEXT_CHANGED
                requestId: req-cycle-example
    HistoryCursorResetRequired:
      description: HISTORY_CURSOR_RESET_REQUIRED only after current exchange authorization when a well-scoped
        cursor can no longer reconcile retained history. Clear the downloaded transcript and restart initial
        history; do not resend messages or change their operation identities.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiError'
              - properties:
                  code:
                    type: string
                    enum:
                      - HISTORY_CURSOR_RESET_REQUIRED
                not:
                  anyOf:
                    - required:
                        - violations
                    - required:
                        - retryAt
          examples:
            reset:
              value:
                code: HISTORY_CURSOR_RESET_REQUIRED
                requestId: req-history-example
    FirstMessageRead:
      description: Current authorized author-only submission. SENT and its timestamps never disclose
        a receiver decline or folder/read state. This is not the conversation or incoming-request representation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FirstMessageSubmission'
          examples:
            processing:
              value:
                submissionId: submission-example-01
                operationId: op_first_message_example_01
                state: PROCESSING
                stateVersion: '1'
                createdAt: '2030-01-01T12:00:00Z'
                updatedAt: '2030-01-01T12:00:00Z'
                content:
                  text: Bu sonuç sende de çıktı mı?
                  targetProfileId: profile-example
            nudge:
              value:
                submissionId: submission-example-01
                operationId: op_first_message_example_01
                state: AWAITING_ACKNOWLEDGEMENT
                stateVersion: '2'
                createdAt: '2030-01-01T12:00:00Z'
                updatedAt: '2030-01-01T12:00:01Z'
                content:
                  text: Bu sonuç sende de çıktı mı?
                  targetProfileId: profile-example
                nudge:
                  code: CONTENT_NUDGE_REQUIRED
                  reasonCode: CONTENT_CAUTION
                  nudgeToken: example-nudge-not-valid
            inReview:
              value:
