  /v1/exchanges/{exchangeId}/reports:
    post:
      tags:
        - SafetyControls
      operationId: reportExchange
      summary: Report a known exchange
      description: |-
        Report this known exchange; resolve its peer internally. The member’s optional context is an allegation, not proof about the counterpart.

        Require active verified reporter access and current participant authorization
        for the target, including retained ended/severed history. Reporting requires
        neither quiz completion, contact permission nor the peer's active access.
        Resolve this author's committed REPORT key before target/catalog checks;
        bind the key to exchange, optional message, reason revision and normalized
        context. A known replay returns the same currently permitted receipt.

        For new work, acquire ordered participant guards, reauthorize the exact
        source and validate the displayed reason revision. Messaging resolves the
        minimum relevant currently authorized evidence through its own data; accept
        no caller-provided snapshot, participant mapping or staff evidence. A retained
        message with withheld text may still support a report using permitted metadata
        and the reporter's context; do not restore unavailable text. Safety registers
        the immutable allegation, restricted evidence and durable review work.

        Commit report registration and any required pending-request closure in one
        transaction. If this exchange is pending at that commit, close it; record a
        receiver refusal once only when the reporter is the original receiver. A
        concurrent decline/closure means no second refusal. If a conversation has
        already started, reporting does not end it, including while waiting for a
        return reply. Block/ending are separate explicit controls. A report against
        old history cannot close a newer exchange for the pair. No allowance refund,
        automatic misconduct finding, account penalty or peer report notification.

        201 confirms registered allegation and durable work; replay returns 200.
        Neither means completed review or enforcement. The receipt never discloses
        private closure, hidden identity, evidence or staff activity. Read the current
        participant view after submission; ordinary sender views cannot reveal prior
        refusal. Reporter outcome/enforcement/appeal interfaces remain D5 work.
        Contracts owns shared recovery; lookup uses the REPORT namespace. A missing
        in-flight lookup is not rejection. D4 governs evidence and receipt retention.
      parameters:
        - $ref: '#/components/parameters/ExchangeId'
        - $ref: '#/components/parameters/SafetyOperationKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
            example:
              reasonId: synthetic-reason-example
              reasonCatalogRevision: synthetic-catalog-revision
              context: İncelenmesini istediğim bağlam.
      responses:
        '201':
          description: Registered allegation, not a review outcome.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Location:
              required: true
              description: Owner-only report read path.
              schema:
                type: string
