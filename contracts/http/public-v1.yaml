                operationId: op_profile_example_02
                expectedRevision: profile-r4
                state: NOT_APPLIED
                stateVersion: '3'
                createdAt: '2030-01-01T12:05:00Z'
                updatedAt: '2030-01-01T12:06:00Z'
                changes: {nickname: limon}
                problem: {code: NICKNAME_UNAVAILABLE, fields: [nickname]}
