            changes: {bio: 'Yeni biyografi.'}
    ProfileChangeRead:
      description: >-
        Current authorized candidate projection. changes is omitted when its
        content is withheld by safety/retention; that is not an empty patch.
        Do not offer acknowledgement without readable changes and the current
        nudge. No historical response cache can restore withheld content.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfileChange'
          examples:
            inReview:
              value:
                changeId: change-example-01
                operationId: op_profile_example_01
                expectedRevision: profile-r3
                state: AWAITING_REVIEW
                stateVersion: '2'
                createdAt: '2030-01-01T12:00:00Z'
                updatedAt: '2030-01-01T12:00:01Z'
                changes: {bio: 'Yeni biyografi.'}
            nudge:
              value:
                changeId: change-example-01
                operationId: op_profile_example_01
                expectedRevision: profile-r3
                state: AWAITING_ACKNOWLEDGEMENT
                stateVersion: '2'
                createdAt: '2030-01-01T12:00:00Z'
                updatedAt: '2030-01-01T12:00:01Z'
                changes: {bio: 'Yeni biyografi.'}
                nudge:
                  code: CONTENT_NUDGE_REQUIRED
                  reasonCode: CONTENT_CAUTION
                  nudgeToken: example-nudge-token-not-valid
                  fields: [bio]
