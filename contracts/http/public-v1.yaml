  /v1/exchanges/{exchangeId}/block:
    post:
      tags:
        - SafetyControls
      operationId: blockExchangePeer
      summary: Block this known peer in both directions
      description: |-
        Require an active verified actor and this exact known participant context
        for a new action; no quiz completion or contact eligibility prerequisite.
        A peer's access loss or prior bilateral block cannot prevent protective work.
        No request body is accepted. The explicit action targets this exchange's
        peer, never a client-supplied account/profile mapping. No lifecycle revision
        is needed: blocking remains the intent even if a reply/ending races it.

        Resolve an authorized committed BLOCK key before current target checks.
        For new work, acquire participant guards in stable order; commit the Safety
        account-level block, caller/context record, action receipt, Messaging pair
        release and required pending/conversation transitions together. This also
        stops any newer open exchange for the same pair. A 200 cannot precede the
        protection commit. No provider or asynchronous projection grants permission
        to keep admitting messages. Publish required repair work durably.

        Block does not file a report, add a refusal, erase delivered history or notify
        the peer of the blocker/reason. Retained reporting remains available. Before
        conversation start the sender retains the historical outgoing shape without
        private receiver closure; established blocked conversations become SEVERED.

        Repeating through the same owned context returns that context's blockId;
        different otherwise-unlinked contexts never reuse a public blockId, original
        pair timestamp or affected-exchange list to reveal a hidden association.
        Both directional block intentions have independent owner records. There is
        no newlyBlocked/previouslyBlocked flag or first-release unblock operation.
        Contracts owns shared idempotency and recovery; lookup uses the BLOCK namespace.
      parameters:
        - $ref: '#/components/parameters/ExchangeId'
        - $ref: '#/components/parameters/SafetyOperationKey'
      responses:
        '200':
          $ref: '#/components/responses/BlockCommitted'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '404':
          $ref: '#/components/responses/ExchangeUnavailable'
        '409':
          $ref: '#/components/responses/SafetyOperationConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        5XX:
          $ref: '#/components/responses/ServiceFailure'
  /v1/me/blocks:
    get:
      tags:
        - SafetyControls
      operationId: listMyBlockContexts
      summary: Read my known blocked contexts
      description: |-
        Require active verified owner access. Return only this member's own context
        records, ordered by their creation time then blockId descending. Do not
        deduplicate separate contexts using a hidden account identity or include
        blocks initiated only by the peer. Replays do not reorder existing records.
        Context resolution may become UNAVAILABLE without lifting the retained
        account-level block. Current context reads use Messaging/Profile owned APIs;
        Safety never queries their tables or upgrades anonymity. Bind keyset cursor
        to owner/list/order, reauthorize each page; refresh the first page for new
        records and deduplicate blockId. Retention can remove rows during traversal.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
          description: Transport page bound only; not a block/report quota.
        - name: cursor
          in: query
          schema:
            $ref: '#/components/schemas/SafetyCursor'
      responses:
