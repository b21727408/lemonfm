        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '404':
          $ref: '#/components/responses/FirstMessageUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        5XX:
          $ref: '#/components/responses/ServiceFailure'
  /v1/me/first-messages/{submissionId}:
    get:
      tags:
      - FirstMessages
      operationId: getMyFirstMessageSubmission
      summary: Read my submission without exposing the receiver inbox state
      description: |-
        Require the active verified author, independently of identifier possession.
        The recipient and staff credentials on this consumer route have no access.
        Re-read the currently permitted projection; ownership does not restore
        safety/retention-withheld content, target or exchange links. SENT describes
        historical admission even if the receiver declined. A decline, filter move
        or read cannot alter this submission's state, stateVersion, updatedAt,
        admission receipt or availability. Conversation state is read separately
        through its participant-authorized contract. No consumer trust/case evidence.
      parameters:
      - $ref: '#/components/parameters/FirstMessageSubmissionId'
      responses:
        '200':
          $ref: '#/components/responses/FirstMessageRead'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '404':
          $ref: '#/components/responses/FirstMessageUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        5XX:
          $ref: '#/components/responses/ServiceFailure'
  /v1/me/first-messages/{submissionId}/acknowledge:
    post:
      tags:
      - FirstMessages
      operationId: acknowledgeFirstMessage
      summary: Explicitly acknowledge the current warning and displayed context
      description: |-
        Authenticate the active verified owner and resolve any committed action
        replay before current target, context or prerequisite checks. For a new
        acknowledgement require readable current text/target and
        AWAITING_ACKNOWLEDGEMENT state. Bind the exact current nudgeToken to author,
        immutable text/target/anchor and policy; obsolete challenges use
        MODERATION_CONTEXT_CHANGED. Validate freshly displayed context for the same
        immutable target/anchor. Changed text/anchor requires a replacement submission,
        never edits in this action. Unknown state or warning cannot auto-acknowledge.

        Record acknowledgement, bound context, action digest and continuation work
        atomically under the guards. Continue checks outside the transaction. If no
        human review has occurred and checks allow, continue the explicitly initiated
        send through admission. Once human review has occurred, acknowledgement alone
        can reach READY_TO_SEND but never replace the explicit Send action. Another
        human review waits again; a nudge cannot override rejection or current access.

        Bind the action key to author, operation kind, submissionId and exact body.
        A known committed replay resolves before state/token checks and returns the
        current permitted projection without another continuation. Reconcile lost
        responses by submissionId. An accepted continuation response is not SENT.
      parameters:
      - $ref: '#/components/parameters/FirstMessageSubmissionId'
      - $ref: '#/components/parameters/FirstMessageOperationKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeFirstMessage'
            example:
              contextToken: example-context-not-valid
              nudgeToken: example-nudge-not-valid
      responses:
        '200':
          $ref: '#/components/responses/FirstMessageRead'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/FirstContactForbidden'
        '404':
          $ref: '#/components/responses/FirstMessageTargetOrSubmissionUnavailable'
        '409':
          $ref: '#/components/responses/FirstMessageConflict'
        '429':
          $ref: '#/components/responses/FirstContactRateLimited'
        5XX:
          $ref: '#/components/responses/ServiceFailure'
  /v1/me/first-messages/{submissionId}/send:
    post:
      tags:
      - FirstMessages
      operationId: sendReviewedFirstMessage
      summary: Explicitly send a human-reviewed message in current context
      description: |-
        Authenticate the active verified owner and resolve any committed action
        replay before current target, context or prerequisite checks. For a new
        continuation require readable submitted text/target and READY_TO_SEND.
        The app must display current identity/anchor context before
        this action. Verify the bound context for the same recipient and immutable
        anchor; a changed door can be consented to through this fresh explicit Send,
        but a changed/removed anchor requires a new submission. No new text here.

        Under the participant guards, check the key and current admission predicates.
        Known quota/context/access failure returns its HTTP error without consuming
        allowance or scheduling a later send. The approval remains a candidate, not
        an invitation to auto-retry when quota returns. Record the action and required
        work atomically. If the current assessment remains applicable, admission may
        commit immediately; otherwise perform required external checks outside the
        transaction and recheck before admission. Automatic allow may complete this
        explicit action; another human-review queue disarms it and needs another Send
        after approval. A new warning needs its own explicit acknowledgement.

        Bind Idempotency-Key to author, this operation kind, submissionId and exact
        contextToken. Resolve a committed action replay before current state checks;
        it returns this submission's current permitted state, never another request
        or allowance charge. Read by submissionId after an uncertain response. Only
        SENT proves admission; PROCESSING can mean continuation work is still pending.
      parameters:
      - $ref: '#/components/parameters/FirstMessageSubmissionId'
      - $ref: '#/components/parameters/FirstMessageOperationKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinueFirstMessage'
            example:
              contextToken: example-context-not-valid
      responses:
        '200':
          $ref: '#/components/responses/FirstMessageRead'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/FirstContactForbidden'
        '404':
          $ref: '#/components/responses/FirstMessageTargetOrSubmissionUnavailable'
        '409':
          $ref: '#/components/responses/FirstMessageConflict'
        '429':
          $ref: '#/components/responses/FirstContactRateLimited'
        5XX:
          $ref: '#/components/responses/ServiceFailure'
  /v1/me/first-messages/{submissionId}/cancel:
    post:
      tags:
      - FirstMessages
      operationId: cancelFirstMessageSubmission
      summary: Cancel my identified unsent submission
      description: |-
        Require the active verified author and no nonempty body. No browsing-ready
        profile or completed quiz is required to cancel existing work. Under the
        participant guards, PROCESSING, AWAITING_ACKNOWLEDGEMENT, AWAITING_REVIEW or
        READY_TO_SEND becomes CANCELED. Already CANCELED is a successful no-op. SENT,
        REJECTED, NOT_SENT or SUPERSEDED gives FIRST_MESSAGE_CONFLICT; never claim
        cancellation after admission or cancel a newer replacement by implication.

        Cancellation, replacement and admission have one guarded outcome. A late
        provider/review decision cannot activate a canceled version. Retained review
        evidence follows D4; cancellation is not evidence deletion or message unsend.
        Bind the key to author, operation kind and submissionId. Resolve committed
        replay before state checks. Read the known submission after an uncertain
        response, preserving the original action identity on permitted retries.
      parameters:
      - $ref: '#/components/parameters/FirstMessageSubmissionId'
      - $ref: '#/components/parameters/FirstMessageOperationKey'
      responses:
        '200':
          $ref: '#/components/responses/FirstMessageRead'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '404':
          $ref: '#/components/responses/FirstMessageUnavailable'
        '409':
          $ref: '#/components/responses/FirstMessageConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        5XX:
          $ref: '#/components/responses/ServiceFailure'
  /v1/me/exchanges:
    get:
      tags:
        - Exchanges
      operationId: listMyExchanges
      summary: Read my incoming, outgoing, conversation or archive group
      description: |-
        Require the active verified member; return only that participant's authorized
        projections. INCOMING contains their pending received requests, default MAIN
        folder; FILTERED is explicitly selectable. folder is invalid for other views.
        OUTGOING contains historical sent requests until a conversation begins,
        regardless of silent receiver decline/closure. CONVERSATIONS contains ACTIVE
        and AWAITING_RETURN_REPLY. ARCHIVE contains receiver-visible closed requests
        and ended/severed conversations, never a sender's silently declined request.

        Order by caller-visible last committed message time, then exchangeId, newest
        first; request order uses first admission time. Receiver-only folder/decline
        activity cannot reorder or remove the sender's outgoing row. Bind keyset
        cursors to the member, view/folder and order. Recheck access on every page.
        This is a mutable list: new messages and phase changes can move rows between
        page requests; deduplicate by exchangeId and refresh the first page on return.
        nextCursor absence ends this traversal, not a claim that concurrent changes
        cannot add entries. No unread count, peer activity time or private cause.

        Exclude this caller’s hidden rows from the four ordinary groups. HIDDEN returns only this caller’s hidden exchanges across their currently permitted request/conversation phases; folder is invalid there. Bind the cursor to this view too. A peer’s hiding/label edits cannot affect another participant’s list. Conversation privateLabel is present only in the original receiver’s own view when set.
      parameters:
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum:
              - INCOMING
              - OUTGOING
              - CONVERSATIONS
              - ARCHIVE
              - HIDDEN
        - name: folder
          in: query
          schema:
            type: string
            enum:
              - MAIN
              - FILTERED
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
          description: Transport page bound; not a product quota, unread count or receiver capacity.
        - name: cursor
          in: query
          schema:
            $ref: '#/components/schemas/ExchangeCursor'
      responses:
        '200':
          description: Currently permitted group page.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeListPage'
              examples:
                incoming:
                  value:
                    items:
                      - kind: INCOMING_REQUEST
                        exchangeId: exchange-example
                        identityMode: ANONYMOUS_SENDER
                        state: PENDING
                        lifecycleRevision: receiver-cycle-1
                        sentAt: '2030-01-01T12:00:00Z'
                        peer:
                          kind: ANONYMOUS
                        folder: MAIN
                        allowedActions:
                          - REPLY
                          - DECLINE
                        firstMessage:
                          kind: TEXT
                          messageId: message-first
                          sequence: '1'
                          sentAt: '2030-01-01T12:00:00Z'
                          author: PEER
                          text: Bu sonuç sende de çıktı mı?
                        context:
                          sharedPoints:
                            - kind: INTEREST
                              label: Gece yürüyüşleri
                outgoing:
                  value:
                    items:
                      - kind: OUTGOING_REQUEST
                        exchangeId: exchange-example
                        identityMode: ANONYMOUS_SENDER
                        sentAt: '2030-01-01T12:00:00Z'
                        peer:
                          kind: OPEN
                          profileId: profile-example
                          nickname: limon
                          representation:
                            kind: BLANK
                        firstMessage:
                          kind: TEXT
                          messageId: message-first
                          sequence: '1'
                          sentAt: '2030-01-01T12:00:00Z'
                          author: SELF
                          text: Bu sonuç sende de çıktı mı?
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        5XX:
          $ref: '#/components/responses/ServiceFailure'
  /v1/exchanges/{exchangeId}:
    get:
      tags:
        - Exchanges
      operationId: getExchange
      summary: Read this exchange as the current participant
      description: |-
        Require active verified participant access, independently of every ID.
        Retained read-only history can remain readable after ending or a block;
        participant membership does not grant a peer's private profile or report.
        The original sender sees OUTGOING_REQUEST before conversation start, including
        after a silent decline. Do not expose its private closure through kind, state,
        revision, timestamps, actions or status. The receiver sees their own request
        state. A conversation preserves original roles and permanent identity mode.
        Compute allowedActions from current predicates without private explanations;
        flags do not authorize a later command. allowedActions enumerates exchange
        lifecycle actions only; block/report and private-preference operations are
        defined separately in this specification and require their own authorization.
      parameters:
        - $ref: '#/components/parameters/ExchangeId'
      responses:
        '200':
          $ref: '#/components/responses/ExchangeRead'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '404':
          $ref: '#/components/responses/ExchangeUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        5XX:
          $ref: '#/components/responses/ServiceFailure'
  /v1/exchanges/{exchangeId}/messages:
    get:
      tags:
        - Exchanges
      operationId: getExchangeHistory
      summary: Read recent or older authorized message history
      description: |-
        Require current participant read access. Without cursor, return INITIAL:
        the latest bounded retained message window in ascending creation sequence,
        the current actor-safe exchange view and a matching recoveryCursor from one
        consistent authorized read boundary. nextCursor traverses older history only.
        With that older-page cursor, return OLDER with current permitted message
        content; never issue a replacement recovery cursor or lifecycle snapshot.

        Gaps in creation sequence are permitted; no assumed consecutive IDs or counts.
        Withheld bodies use UNAVAILABLE where their identity remains retained; fully
        removed entries can be omitted. Never restore redacted text from snapshots
        or a stored response. No private decline/report/folder events appear in history.
        Wrong-scope/malformed cursors use INVALID_INPUT. An authorized expired repair
        boundary uses HISTORY_CURSOR_RESET_REQUIRED, not an empty successful history.
        Reading/history traversal sends no message and acknowledges no human reading.
      parameters:
        - $ref: '#/components/parameters/ExchangeId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
          description: Transport page bound; not a product quota, unread count or receiver capacity.
        - name: cursor
          in: query
          schema:
            $ref: '#/components/schemas/ExchangeCursor'
      responses:
        '200':
          description: Initial recent window or an older page with distinct cursor semantics.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeHistoryPage'
              examples:
                initial:
                  value:
                    kind: INITIAL
                    items:
                      - kind: TEXT
                        messageId: message-first
                        sequence: '1'
                        sentAt: '2030-01-01T12:00:00Z'
                        author: PEER
                        text: Bu sonuç sende de çıktı mı?
                    recoveryCursor: synthetic-recovery-cursor
                    exchange:
                      kind: INCOMING_REQUEST
                      exchangeId: exchange-example
                      identityMode: ANONYMOUS_SENDER
                      state: PENDING
                      lifecycleRevision: receiver-cycle-1
                      sentAt: '2030-01-01T12:00:00Z'
                      peer:
                        kind: ANONYMOUS
                      folder: MAIN
                      allowedActions:
                        - REPLY
                        - DECLINE
                      firstMessage:
                        kind: TEXT
                        messageId: message-first
                        sequence: '1'
                        sentAt: '2030-01-01T12:00:00Z'
                        author: PEER
                        text: Bu sonuç sende de çıktı mı?
                      context:
                        sharedPoints:
                          - kind: INTEREST
                            label: Gece yürüyüşleri
                older:
                  value:
                    kind: OLDER
                    items: []
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '404':
          $ref: '#/components/responses/ExchangeUnavailable'
        '410':
          $ref: '#/components/responses/HistoryCursorResetRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        5XX:
          $ref: '#/components/responses/ServiceFailure'
    post:
      tags:
        - Exchanges
      operationId: sendConversationMessage
      summary: Send a text message in the observed active conversation
      description: |-
