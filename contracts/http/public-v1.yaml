      - name: anchorKind
        in: query
        schema:
          type: string
          enum:
          - RESULT
          - PROMPT_ANSWER
      - name: anchorId
        in: query
        schema:
          $ref: '#/components/schemas/OpaqueResourceId'
      - name: anchorRevision
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
