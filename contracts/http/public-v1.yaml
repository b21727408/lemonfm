  /v1/exchanges/{exchangeId}/changes:
    get:
      tags:
        - Exchanges
      operationId: getExchangeChanges
      summary: Repair message updates and current lifecycle after interruption
      description: |-
        Require active verified participant read access and the last confirmed HTTP
        recoveryCursor, never a socket sequence or an older-history cursor. Bind
        cursors to caller and exchange. Traverse a bounded portion of the retained
        change stream in order and return a cursor for confirmed progress plus a fresh
        actor-safe exchange view. hasMore requires another page even if changes is
        empty. A lifecycle-only change may advance progress without a message item.

        Changes can upsert currently permitted message projections or remove IDs.
        Reproject from current authorization: a historical upsert cannot resurrect
        text withdrawn afterwards. A redaction/deletion of an old message is repair
        work even when its creation sequence is older than the current window.
        Deduplicate by messageId; update/remove already loaded messages and append new
        admissions. Do not insert unrelated older messages into the visible window
        merely because their content changed; older paging reads their current view.

        Private receiver decline/folder/read events do not enter the shared message
        change stream or alter sender progress. Receiver-only state is repaired by
        the fresh participant view. Do not include raw private event counts or causes.
        With no shared change to advance, preserve the supplied recovery cursor.
        Unknown change kinds require safe history reset rather than guessed progress.
        Wrong-scope/malformed cursor uses INVALID_INPUT. If retained changes cannot
        repair an authorized cursor, return 410 HISTORY_CURSOR_RESET_REQUIRED; clear
        downloaded history and bootstrap again, preserving unsent action identities.
