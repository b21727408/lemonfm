              schema:
                $ref: '#/components/schemas/ContactContext'
              examples:
                unanchored:
                  value:
                    targetProfileId: profile-example
                    contextToken: example-context-not-valid
                    identityMode: ANONYMOUS_SENDER
                anchored:
                  value:
                    targetProfileId: profile-example
                    contextToken: example-context-not-valid
                    identityMode: OPEN
                    anchor:
                      kind: PROMPT_ANSWER
                      id: prompt-example
                      revision: answer-r1
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '404':
          $ref: '#/components/responses/ContactUnavailable'
        '409':
          $ref: '#/components/responses/ContactContextConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        5XX:
          $ref: '#/components/responses/ServiceFailure'
  /v1/me/first-messages:
    post:
      tags:
      - FirstMessages
      operationId: submitFirstMessage
      summary: Submit an immutable first message for checks and possible admission
      description: |-
        Authenticate the active verified author and resolve any known committed key
        before checking current target/pair access, profile readiness or allowance.
        An authorized replay reads the same historical submission, with current safe
        disclosure, even after a receiver decline. For a new registration require a
        browsing-ready profile and completed-quiz prerequisite. The target is a
        different currently permitted account. Resolve identities on the server,
        not from author IDs or an anonymity selector.

        Before registration, authorize caller/target, normalize and validate text,
        and check the displayed context and current admission predicates under the
        participant guards. Known failures create no new candidate. This does not
        reserve a pair or allowance. Register immutable content, initial context,
        operation digest and durable checking work atomically. No external provider
        call runs in that transaction; admission is a later guarded transaction.

        An explicit replacesSubmissionId must identify this author's live candidate
        for the same target. A missing/foreign target is FIRST_MESSAGE_UNAVAILABLE;
        wrong target or terminal state is FIRST_MESSAGE_CONFLICT. Successful creation
        supersedes it atomically. Failure before registration leaves it live; later
        failure of the replacement cannot restore it. Local editing alone does not
        cancel anything. Distinct candidates reserve no receiver or pair capacity.

        Automatic allow continues this explicit send under the displayed context,
        rechecking current account/profile/quiz, door, anchor, pair and applicable
        rolling allowance at admission. Commit request, usage, receipt, SENT state
        and required durable events together. A conflict or provider failure after
        registration produces NOT_SENT with a safe problem, never a fabricated send.
        Rejection produces REJECTED; human review produces AWAITING_REVIEW, then
        READY_TO_SEND on approval. Human approval never admits the request by itself.

        201 creates the submission resource; only SENT proves admission. A committed
        replay returns 200 for that same submission's current permitted projection,
        before checking now-stale context or spent allowance. Bind the key to author,
        this operation kind, target, normalized text, exact context/anchor and any
        replacement ID. Changed input conflicts. An unknown outcome is recovered by
        the original creation key; an in-flight lookup miss cannot prove rejection.
      parameters:
      - $ref: '#/components/parameters/FirstMessageOperationKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitFirstMessage'
            example:
              targetProfileId: profile-example
              contextToken: example-context-not-valid
              text: Bu sonuç sende de çıktı mı?
      responses:
        '201':
          $ref: '#/components/responses/FirstMessageCreated'
        '200':
          $ref: '#/components/responses/FirstMessageRead'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/FirstContactForbidden'
        '404':
          $ref: '#/components/responses/FirstMessageTargetOrSubmissionUnavailable'
        '409':
          $ref: '#/components/responses/FirstMessageConflict'
        '429':
          $ref: '#/components/responses/FirstContactRateLimited'
        5XX:
          $ref: '#/components/responses/ServiceFailure'
    get:
      tags:
      - FirstMessages
      operationId: listMyFirstMessageSubmissions
      summary: Read my retained submissions for review and recovery
      description: |-
        Author-only work/history list, not the receiver inbox. Require active verified
        account access even if the profile later becomes incomplete. List retained
        live and terminal submissions by descending server registration order.
        The initial traversal fixes an upper registration bound; new submissions
        appear on refresh. Subsequent pages use a caller-bound opaque keyset cursor,
        never device time or a mutable updatedAt sort. An invalid, foreign or expired
        cursor uses INVALID_INPUT; restart this read without resending content.
        Current authorization/retention applies on every page; items can be omitted
        while nextCursor still exists. Absence is not proof a particular send failed.
        These pagination bounds limit transport work, not sender quota or receiver load.
        No filter, order, count, timestamp or nextCursor exposes receiver activity or
        silent decline. Reading does not acknowledge a warning or continue sending.
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 4096
      responses:
        '200':
          description: Permitted submission page; absence of nextCursor ends this traversal only.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirstMessageSubmissionPage'
              examples:
                pendingReview:
                  value:
                    items:
                    - submissionId: submission-example-01
                      operationId: op_first_message_example_01
                      state: AWAITING_REVIEW
                      stateVersion: '2'
                      createdAt: '2030-01-01T12:00:00Z'
                      updatedAt: '2030-01-01T12:00:01Z'
                      content:
                        text: Bu sonuç sende de çıktı mı?
                        targetProfileId: profile-example
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        5XX:
          $ref: '#/components/responses/ServiceFailure'
  /v1/me/first-messages/by-operation/{operationId}:
    get:
      tags:
      - FirstMessages
      operationId: getMyFirstMessageByOperation
      summary: Recover a submission using its original creation action identity
      description: |-
        Resolve only the authenticated author's submitFirstMessage key namespace.
        This is not a lookup by diagnostic requestId or by a send/acknowledge/cancel
        action key. Require current active verified account access. Return the same
        current permitted projection as getMyFirstMessageSubmission. Missing, foreign
