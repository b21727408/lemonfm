          required: true
          schema:
            $ref: '#/components/schemas/ExchangeCursor'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
          description: Transport page bound; not a product quota, unread count or receiver capacity.
      responses:
        '200':
          description: Ordered current-safe repair changes and authoritative participant view.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeChangesPage'
              examples:
                caughtUp:
                  value:
                    changes: []
                    recoveryCursor: synthetic-recovery-cursor
                    hasMore: false
                    exchange:
                      kind: CONVERSATION
                      exchangeId: exchange-example
                      identityMode: ANONYMOUS_SENDER
                      selfRole: ORIGINAL_RECEIVER
                      state: ACTIVE
                      lifecycleRevision: conversation-cycle-1
                      peer:
                        kind: ANONYMOUS
                        handle: conversation-local-example
                      allowedActions:
                        - SEND
                        - END
                removed:
                  value:
                    changes:
                      - kind: REMOVE_MESSAGE
                        messageId: message-first
                    recoveryCursor: synthetic-next-recovery
                    hasMore: false
                    exchange:
                      kind: CONVERSATION
                      exchangeId: exchange-example
                      identityMode: ANONYMOUS_SENDER
                      selfRole: ORIGINAL_RECEIVER
                      state: ACTIVE
                      lifecycleRevision: conversation-cycle-1
                      peer:
                        kind: ANONYMOUS
                        handle: conversation-local-example
                      allowedActions:
                        - SEND
                        - END
